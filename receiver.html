function kickingCard(p, st) {
  return !!(st && p && p.team && st.specialLabel && /Kickoff$/.test(st.specialLabel) && st.specialTeam === p.team);
}
// Pure per-card perspective view. p = cfg player, g = that team's game ({home, away,...}), st = derived
// state or null. Returns null when there is nothing live to show (card keeps its pregame text), else
// { clock, score, situation } where situation === null means HIDE the row (halftime/final).
// Rules ported from receiver.html's paint: own-score-first; FINAL = `W|L|T own - opp VS|@ opp`; situation
// priority specialLabel > End Zone (own possession) > '<TEAM> on Defense' > down & distance > '--'.
function cardView(p, g, st) {
  if (!st || !g || !p || !p.team) return null;
  const isHome = g.home === p.team;
  const ownScore = isHome ? st.homePts : st.awayPts;
  const oppScore = isHome ? st.awayPts : st.homePts;
  const oppAbbr = isHome ? g.away : g.home;
  const vsOrAt = isHome ? 'VS' : '@';
  const hasScores = ownScore != null && oppScore != null;
  let score;
  if (st.gamestate === 'FINAL' && hasScores) {
    const result = ownScore > oppScore ? 'W' : (ownScore < oppScore ? 'L' : 'T');
    score = result + ' ' + ownScore + ' - ' + oppScore + '\u2003' + vsOrAt + ' ' + oppAbbr; // em-space (not collapsed) before VS|@ OPP
  } else {
    score = (hasScores ? (ownScore + ' - ' + oppScore) : '--') + '\u2003' + vsOrAt + ' ' + oppAbbr; // in-game: score, em-space, VS|@ OPP (same tail as FINAL)
  }
  const terminal = st.gamestate === 'HALFTIME' || st.gamestate === 'FINAL';
  let situation = null;
  if (!terminal) {
    if (st.specialLabel) situation = st.specialLabel;
    else if (st.endZone && st.possession === p.team) situation = 'End Zone';
    else if (st.possession && st.possession !== p.team) situation = p.team + ' on Defense';
    else if (st.down && st.distance != null) situation = (ordinal(st.down) + ' & ' + st.distance + ' @ ' + (st.fieldTeam || '') + ' ' + (st.fieldYards != null ? st.fieldYards : '')).trim();
    else situation = '--';
  }
  const dotPct = fieldDotPct(p, st);
  return { clock: st.gamestate === 'FINAL' ? '' : (st.clockStr || ''), score: score, situation: situation, dotLeft: dotPct === null ? null : dotLeftPct(p.side, dotPct) };
}

// Cumulative stat line (copied verbatim from debug-cards.html formatStatLine, which is itself the receiver's).
// QB: `C/A CMP, N YD, N TD, N CAR, N YD, N TD`; everyone else: `N CAR, N YD, R/T REC, N YD, N TD`; only nonzero
// parts are listed; DEF falls through the non-QB branch and yields '' (blank), same as debug.
function formatStatLine(stats, position) {
  if (!stats) return '--';
  const parts = [];
  if (position === 'QB') {
    if (stats.pass_att) parts.push(`${stats.pass_cmp || 0}/${stats.pass_att} CMP`);
    if (stats.pass_yd) parts.push(`${stats.pass_yd} YD`);
    if (stats.pass_td) parts.push(`${stats.pass_td} TD`);
    if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
    if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
    if (stats.rush_td) parts.push(`${stats.rush_td} TD`);
    return parts.length ? parts.join(', ') : '--';
  }
  if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
  if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
  if (stats.rec_tgt || stats.rec) parts.push(`${stats.rec || 0}/${stats.rec_tgt || 0} REC`);
  if (stats.rec_yd) parts.push(`${stats.rec_yd} YD`);
  const tds = (stats.rush_td || 0) + (stats.rec_td || 0);
  if (tds) parts.push(`${tds} TD`);
  return parts.length ? parts.join(', ') : '';
}

// playerId -> stat-line text for every picked player whose game stats have been fetched AND who has a row
// there; anything else is omitted so that card's line stays as it was (blank before kickoff).
function computeStatLines(cfg, statsByGame, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId) return;
      const g = games ? games[p.team] : null;
      const rows = (g && g.gameKey) ? statsByGame[g.gameKey] : null;
      if (!rows || !rows[p.playerId]) return;
      out[p.playerId] = formatStatLine(rows[p.playerId], p.pos);
    });
  });
  return out;
}

// S3.3: ticker text for one card = signed change in the DISPLAYED (2dp) points between two consecutive stats
// polls, e.g. '+1.90' / '-1.00'; null when there is no baseline yet (first poll seeds it) or the net change is 0.
function pointsDelta(prev, next) {
  if (prev == null || next == null) return null;
  const d = Math.round((Number(fmtPts(next)) - Number(fmtPts(prev))) * 100) / 100;
  if (Math.abs(d) < 0.005) return null;
  return (d > 0 ? '+' : '') + fmtPts(d);
}
// Mutates lastPoints (playerId -> last displayed points) and returns { playerId: tickerText } for changed cards only.
// A null/absent points value never overwrites a stored baseline.
function updateTickers(lastPoints, pts) {
  const out = {};
  Object.keys(pts || {}).forEach(function(pid) {
    const next = pts[pid];
    if (next == null) return;
    const t = pointsDelta(lastPoints[pid], next);
    if (t) out[pid] = t;
    lastPoints[pid] = next;
  });
  return out;
}

// Stat adjustments (2026-10-04): a points change with NO new carry / catch / target / pass attempt for that player since the
// last poll (e.g. a yardage correction) is not a play: points + stat line still update, but no floating delta. DEF cards
// (no carries/catches) are excluded here, so they keep every delta.
const PLAY_COUNTERS = ['rush_att', 'rec_tgt', 'rec', 'pass_att', 'pass_cmp'];
function playCounterSig(stats) {
  return PLAY_COUNTERS.map(function(k) { return Number((stats && stats[k]) || 0); }).join('|');
}
function computeCounterSigs(cfg, statsByGame, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId || p.pos === 'DEF') return;
      const g = games ? games[p.team] : null;
      const rows = (g && g.gameKey) ? statsByGame[g.gameKey] : null;
      if (!rows || !rows[p.playerId]) return;
      out[p.playerId] = playCounterSig(rows[p.playerId]);
    });
  });
  return out;
}

// One poll tick. state = { cfg, games, statsByGame, statesByGame, finalFetched, lastScoresMs, lastPoints }; deps = { now, fetchGames, fetchGamePlays,
// fetchGameStats, paint }. Mutates state; returns { nextWakeMs, done, polled, errors }. Fetch errors keep
// the previously stored stats (card keeps its last points) and are reported, never thrown.
async function pollOnce(state, deps) {
  const now = deps.now();
  const errors = [];
  let plan = planPolls(relevantGames(state.cfg, state.games), state.finalFetched, now, state.lastScoresMs);
  if (plan.refreshScores) {
    state.lastScoresMs = now; // set even on failure so a broken /scores is not hammered every tick
    try {
      state.games = await deps.fetchGames(state.cfg.season, state.cfg.week);
      plan = planPolls(relevantGames(state.cfg, state.games), state.finalFetched, now, state.lastScoresMs);
    } catch (e) { errors.push('scores: ' + e.message); }
  }
  state.statesByGame = state.statesByGame || {};
  await Promise.all(plan.pollKeys.map(async function(key) {
    let ok = true;
    await Promise.all([
      (async function() {
        try {
          state.statsByGame[key] = await deps.fetchGameStats(state.cfg.season, key, idsForGame(state.cfg, state.games, key));
        } catch (e) { ok = false; errors.push(key + ' stats: ' + e.message); }
      })(),
      (async function() {
        try {
          const plays = await deps.fetchGamePlays(state.cfg.season, key);
          if (plays && plays.length) state.statesByGame[key] = deriveCurrentState(plays, gameByKey(state.games, key));
        } catch (e) { ok = false; errors.push(key + ' plays: ' + e.message); }
      })()
    ]);
    if (ok && plan.finalKeys.indexOf(key) !== -1) state.finalFetched[key] = true;
  }));
  state.lastPoints = state.lastPoints || {};
  state.lastSigs = state.lastSigs || {};
  const pts = computeCardPoints(state.cfg, state.statsByGame, state.games);
  const sigs = computeCounterSigs(state.cfg, state.statsByGame, state.games);
  const tickers = updateTickers(state.lastPoints, pts);
  Object.keys(tickers).forEach(function(pid) {
    // stat adjustment: points moved but no carry/catch/target/pass-attempt counter did since the last poll => update silently
    if (sigs[pid] !== undefined && state.lastSigs[pid] !== undefined && sigs[pid] === state.lastSigs[pid]) delete tickers[pid];
  });
  Object.keys(sigs).forEach(function(pid) { state.lastSigs[pid] = sigs[pid]; });
  deps.paint(pts, state.statesByGame, tickers);
  const next = planPolls(relevantGames(state.cfg, state.games), state.finalFetched, deps.now(), state.lastScoresMs);
  return { nextWakeMs: next.nextWakeMs, done: next.done, polled: plan.pollKeys, errors: errors };
}

// ---- DOM (browser only) ----
// ---------------------------------------------------------------------------
// Card redesign port (2026-10-03, from debug-cards.html): each card sits in a reserved .pc-slot as
// [outer-edge position-colored .pc-tab | .pc-body]. Body = name + points, state line, field-trail row
// (track, down-colored fill, team-logo ball marker, down&distance pill), stat line. Cards start
// .collapsed (pregame / FINAL: no trail row); LIVE and HALFTIME use the full layout.
// ---------------------------------------------------------------------------
const POSITION_COLORS = { QB: '#e6145a', RB: '#14baa4', WR: '#3c91f5', TE: '#fa9637', DEF: '#9b3ffa' };
// Trail color by down: yellowgreen / yelloworange / orangered / redpurple.
const DOWN_COLORS = { 1: '#9acd32', 2: '#ffb000', 3: '#ff4500', 4: '#c71585' };
function teamLogoUrl(abbr) {
  return 'https://a.espncdn.com/i/teamlogos/nfl/500/' + String(abbr).toLowerCase() + '.png';
}

// Stat line: no ellipsis; an overflowing line ping-pongs (rest -> scroll to end -> hold -> scroll back) via the
// Web Animations API. Re-measures only when the text or the box width changed, so repaints don't restart it.
var STAT_SCROLL_PX_PER_S = 11.25, STAT_REST_S = 10, STAT_HOLD_S = 5;
function setStatLine(el, text) {
  el._statText = text;
  refitStatLine(el);
}
function refitStatLine(el) {
  const text = el._statText || '';
  const key = text + '|' + el.clientWidth;
  if (el._statKey === key) return;
  el._statKey = key;
  if (el._statAnim) { el._statAnim.cancel(); el._statAnim = null; }
  el.classList.remove('scrolling');
  el.textContent = '';
  const inner = document.createElement('span');
  inner.className = 'pc-stats-inner';
  const seg = document.createElement('span');
  seg.className = 'pc-stats-seg';
  seg.textContent = text;
  inner.appendChild(seg);
  el.appendChild(inner);
  const boxW = el.clientWidth;
  if (boxW > 0 && seg.offsetWidth > boxW + 0.5) {
    el.classList.add('scrolling');
    const dist = seg.offsetWidth - boxW;
    const legS = dist / STAT_SCROLL_PX_PER_S;
    const total = STAT_REST_S + legS + STAT_HOLD_S + legS;
    if (inner.animate) {
      el._statAnim = inner.animate([
        { transform: 'translateX(0)', offset: 0 },
        { transform: 'translateX(0)', offset: STAT_REST_S / total },
        { transform: 'translateX(-' + dist + 'px)', offset: (STAT_REST_S + legS) / total },
        { transform: 'translateX(-' + dist + 'px)', offset: (STAT_REST_S + legS + STAT_HOLD_S) / total },
        { transform: 'translateX(0)', offset: 1 }
      ], { duration: total * 1000, iterations: Infinity, easing: 'linear' });
    }
  }
}
function refitAllStatLines() {
  const els = document.querySelectorAll('#lane-matchup .pc-stats');
  for (let i = 0; i < els.length; i++) {
    if (els[i]._statText !== undefined) { els[i]._statKey = null; refitStatLine(els[i]); }
  }
}
if (typeof window !== 'undefined') {
  window.addEventListener('resize', refitAllStatLines);
  window.addEventListener('load', refitAllStatLines);
  if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) document.fonts.ready.then(refitAllStatLines);
}

// Point delta: a fresh element per scoring play over the fantasy-points total (CSS keyframes do the 5s fade/rise).
function spawnPointDelta(card, text) {
  const body = card.querySelector('.pc-body');
  if (!body) return;
  const el = mkEl('div', 'pc-delta' + (String(text).charAt(0) === '-' ? ' neg' : ''), text);
  body.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 5200);
}

// Down & distance pill beside the ball marker, on the side FACING MIDFIELD (ball in own territory or on defense ->
// ahead of the marker; past the 50 -> behind it, over the trail; exactly 50 = ahead). Returns the offset (units) from
// the marker center to the pill's marker-facing edge (used for the trail gradient).
function placePill(card, mode, shownPct) {
  const pill = card._pill;
  pill.style.left = '';
  pill.style.right = '';
  pill.style.paddingLeft = '';
  pill.style.paddingRight = '';
  pill.style.transformOrigin = '';
  if (mode === 'center') {
    pill.classList.add('centered');
    pill.style.left = '50%';
    return;
  }
  if (mode === 'edge') {
    // No marker circle/logo (defense / halftime): the pill sits at the track edge on the card's own-goal side (own column = left, opp column = right), base padding only.
    pill.classList.remove('centered');
    if (card._side === 'own') { pill.style.left = '0'; pill.style.transformOrigin = 'left center'; }
    else { pill.style.right = '0'; pill.style.transformOrigin = 'right center'; }
    return;
  }
  pill.classList.remove('centered');
  const dirRight = (card._side === 'own'); // on-screen direction of offense travel
  const rightOfMarker = (mode === 'ahead') ? dirRight : !dirRight;
  pill.style.transformOrigin = rightOfMarker ? 'left center' : 'right center'; // scaleX condense keeps the marker-facing edge fixed
  const plainMarker = card._marker.classList.contains('plain');
  const EXTEND_U = 5; // pill rectangle extends this many units under the (higher z-index) marker
  const offU = (plainMarker ? 10 : (mode === 'ahead' ? 13.5 : 10)) - EXTEND_U;
  const facePad = 6 + EXTEND_U; // base horizontal padding is 6u
  if (rightOfMarker) {
    pill.style.left = 'calc(' + shownPct + '% + (' + offU + ' * var(--u)))';
    pill.style.paddingLeft = 'calc(' + facePad + ' * var(--u))';
  } else {
    pill.style.right = 'calc(' + (100 - shownPct) + '% + (' + offU + ' * var(--u)))';
    pill.style.paddingRight = 'calc(' + facePad + ' * var(--u))';
  }
  return offU;
}

// Fraction of the 60-minute game still to play, from a derived state: Q<n> <m>:<ss> clock, 0.5 at halftime, null
// when FINAL / no clock (=> the static pregame projection stays).
function liveFraction(st) {
  if (!st || st.gamestate === 'FINAL') return null;
  if (st.gamestate === 'HALFTIME') return 0.5;
  const m = /^Q(\d+)\s+(\d+):(\d+)$/.exec(String(st.clockStr || ''));
  if (!m) return null;
  const q = Number(m[1]);
  const min = Number(m[2]);
  const sec = Number(m[3]);
  if (q > 4) return 0;
  const elapsed = (q - 1) * 15 + (15 - (min + sec / 60));
  return Math.min(1, Math.max(0, (60 - elapsed) / 60));
}
// Projection slot: static pregame projection until the game is live; while live (incl. halftime) = current league
// points + pregame projection x fraction of the game remaining. >=20% under the original => soft red, >=20% over =>
// soft green. Needs card._actual (set by paintPoints) and card._frac (set by paintStates).
function paintProjection(card) {
  const el = card._projEl;
  if (!el) return;
  el.style.color = '';
  if (card._proj == null) return;
  const proj = card._proj;
  card._projShown = proj;
  el.textContent = fmtPts(proj);
  if (card._frac == null || card._actual == null) return;
  let est = card._actual + proj * card._frac;
  if (card._isDef) est = Math.min(card._actual, est); // defense: the lesser of the current points and the usual math
  card._projShown = est;
  el.textContent = fmtPts(est);
  if (proj > 0 && !card._isDef) { // defense keeps the default color (no red/green)
    if (est <= proj * 0.8) el.style.color = '#f28b82';
    else if (est >= proj * 1.2) el.style.color = '#81c995';
  }
}

// Trail row for one card (port of debug-cards updateFieldDot, driven by this card's own game state `st`): marker =
// ball position along the track, fill = trail from the own goal line to the ball, pill = situation text. Non-field
// looks (HALFTIME, kickoff/extra point, defense, no ball data) = plain circle pinned at the own-goal end + pill beside
// it, no trail. No state / FINAL: collapsed card, trail not rendered.
function paintTrail(card, p, st) {
  const marker = card._marker;
  const fill = card._fill;
  if (!marker || !fill) return;
  if (card._isDef) return; // defense cards never show the trail row (hidden in CSS)
  const isOwn = (card._side === 'own');
  const wasVisible = marker.classList.contains('visible');
  if (!st || st.gamestate === 'FINAL') {
    marker.classList.remove('visible');
    fill.style.width = '0';
    return;
  }
  let pct = null; // yards from this card's own goal line (0-100)
  let mode = 'center';
  let defense = false;
  let noMarker = false; // a team on defense shows the pill only, no circle/logo
  if (st.gamestate === 'HALFTIME' || st.specialLabel) {
    pct = 0; defense = true; mode = 'ahead';
    if (st.gamestate === 'HALFTIME' || kickingCard(p, st)) noMarker = true;
  } else if (st.possession && st.possession !== p.team) {
    pct = 0; defense = true; mode = 'ahead'; noMarker = true;
  } else if (st.possession === p.team) {
    if (st.endZone) {
      pct = 100;
    } else if (st.fieldTeam && st.fieldYards != null && isFinite(Number(st.fieldYards))) {
      pct = (st.fieldTeam === p.team) ? Number(st.fieldYards) : 100 - Number(st.fieldYards);
    }
    if (pct !== null) mode = (pct > 50) ? 'behind' : 'ahead';
  }
  if (pct === null) { pct = 0; defense = true; mode = 'ahead'; }
  pct = Math.max(0, Math.min(100, pct));
  const shownPct = 5 + 0.9 * (isOwn ? pct : 100 - pct); // ball travels 5%-95% of the track
  const downColor = DOWN_COLORS[st.down] || DOWN_COLORS[1];
  const gradDir = isOwn ? 'to right' : 'to left';
  const els = [marker, fill, card._pill];
  if (!wasVisible) els.forEach(function(e) { e.classList.add('no-anim'); }); // jump, don't sweep in
  marker.classList.toggle('plain', defense);
  marker.classList.toggle('no-marker', noMarker);
  marker.style.left = shownPct + '%';
  fill.style.width = defense ? '0' : (5 + 0.9 * pct) + '%'; // trail ends at the ball
  const offU = placePill(card, noMarker ? 'edge' : mode, shownPct);
  // Ball past midfield (mode 'behind'): the pill sits ON the trail and hides its bright end, so the gradient reaches
  // full color at the pill's yard-0-facing edge instead (pixel stops measured at paint time; falls back to the plain
  // gradient if anything is unmeasurable).
  let grad = 'linear-gradient(' + gradDir + ', rgba(255,255,255,0), ' + downColor + ')';
  if (!defense && mode === 'behind' && offU != null) {
    const uPx = marker.offsetWidth / 22; // marker box is 22u wide
    const trailW = fill.parentNode.clientWidth;
    const sx = parseFloat(getComputedStyle(card).getPropertyValue('--pill-sx')) || 1;
    const pillW = card._pill.offsetWidth * sx;
    const fillPx = trailW * (5 + 0.9 * pct) / 100;
    const stopPx = fillPx - (offU * uPx + pillW);
    if (uPx > 0 && trailW > 0 && pillW > 0 && stopPx > 0) {
      grad = 'linear-gradient(' + gradDir + ', rgba(255,255,255,0) 0px, ' + downColor + ' ' + stopPx.toFixed(1) + 'px, ' + downColor + ' 100%)';
    }
  }
  fill.style.background = grad;
  if (!wasVisible) {
    void marker.offsetWidth;
    els.forEach(function(e) { e.classList.remove('no-anim'); });
    marker.classList.add('visible');
  }
}

// Bottom bar (2026-10-04): per team, the sum of the lineup's current fantasy points (large, same size as a card's points)
// followed by the sum of the lineup's displayed projections (small); own team left, opp mirrored on the right.
function paintBottomBar() {
  const bar = document.getElementById('bottom-box');
  if (!bar) return;
  const sums = { own: { pts: 0, proj: 0, anyPts: false, n: 0 }, opp: { pts: 0, proj: 0, anyPts: false, n: 0 } };
  const cards = document.querySelectorAll('#lane-matchup .player-card[data-pid]');
  for (let i = 0; i < cards.length; i++) {
    const s = sums[cards[i]._side];
    if (!s) continue;
    s.n++;
    if (cards[i]._actual != null) { s.pts += cards[i]._actual; s.anyPts = true; }
    if (cards[i]._projShown != null) s.proj += cards[i]._projShown;
  }
  ['own', 'opp'].forEach(function(k) {
    let side = bar.querySelector('.bb-side.' + k);
    if (!side) {
      side = mkEl('div', 'bb-side ' + k);
      side.appendChild(mkEl('span', 'bb-pts', ''));
      side.appendChild(mkEl('span', 'bb-proj', ''));
      bar.appendChild(side);
    }
    side.style.display = sums[k].n ? '' : 'none';
    side.querySelector('.bb-pts').textContent = sums[k].anyPts ? fmtPts(sums[k].pts) : '-';
    side.querySelector('.bb-proj').textContent = fmtPts(sums[k].proj);
  });
}

function paintPoints(pts) {
  const cards = document.querySelectorAll('#lane-matchup .player-card[data-pid]');
  for (let i = 0; i < cards.length; i++) {
    const pid = cards[i].getAttribute('data-pid');
    const el = cards[i].querySelector('.pc-actual-pts');
    if (el && Object.prototype.hasOwnProperty.call(pts, pid) && pts[pid] != null) {
      el.textContent = fmtPts(pts[pid]);
      cards[i]._actual = Number(pts[pid]);
      paintProjection(cards[i]);
    }
  }
  paintBottomBar();
}

// Writes each card's cumulative stat line into .pc-stats (only cards present in `lines`).
function paintStatLines(lines) {
  const cards = document.querySelectorAll('#lane-matchup .player-card[data-pid]');
  for (let i = 0; i < cards.length; i++) {
    const pid = cards[i].getAttribute('data-pid');
    if (!lines || !Object.prototype.hasOwnProperty.call(lines, pid)) continue;
    if (cards[i]._stats) setStatLine(cards[i]._stats, lines[pid]);
  }
}

// Each changed card's signed fantasy-points delta floats over its points total (spawnPointDelta); cards with no
// change are left alone.
function paintTickers(tickers) {
  const cards = document.querySelectorAll('#lane-matchup .player-card[data-pid]');
  for (let i = 0; i < cards.length; i++) {
    const pid = cards[i].getAttribute('data-pid');
    if (!tickers || !Object.prototype.hasOwnProperty.call(tickers, pid)) continue;
    if (tickers[pid]) spawnPointDelta(cards[i], String(tickers[pid]));
  }
}

// Batch 3: /scores says the game is over but the plays feed has not (yet) delivered its game_over record (the single final fetch can run first) => show the card as FINAL from the last known scores.
function finalizedState(st) {
  return Object.assign({}, st, { gamestate: 'FINAL', clockStr: '', possession: null, specialLabel: null, specialTeam: null, endZone: false, down: null, distance: null });
}
// Per card, from its own game state: clock + score text, the situation pill + trail row, the collapsed/live layout,
// and the live projection. No state yet (pregame) leaves the card as built (collapsed, pregame text).
function paintStates(cfg, games, sts) {
  const byPid = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) { if (!p.empty && p.playerId) byPid[p.playerId] = p; });
  });
  const cards = document.querySelectorAll('#lane-matchup .player-card[data-pid]');
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    const p = byPid[card.getAttribute('data-pid')];
    const g = (p && games) ? games[p.team] : null;
    let st = (g && g.gameKey && sts) ? sts[g.gameKey] : null;
    if (st && g && g.isOver && st.gamestate !== 'FINAL') st = finalizedState(st);
    const v = cardView(p, g, st);
    if (!v) {
      // No game state yet (pregame / bye): the points slot shows '-' unless real non-zero points already exist.
      const ptsEl = card.querySelector('.pc-actual-pts');
      if (ptsEl && (card._actual == null || card._actual === 0)) ptsEl.textContent = '-';
      continue;
    }
    if (card._opp) card._opp.textContent = ''; // pregame line 3 only
    const isFinal = st.gamestate === 'FINAL';
    const clockEl = card.querySelector('.pc-clock');
    const scoreEl = card.querySelector('.pc-score');
    if (clockEl) clockEl.textContent = v.clock;
    if (scoreEl) scoreEl.textContent = v.score;
    const pill = card._pill;
    if (isFinal) {
      pill.style.display = 'none';
    } else {
      pill.style.display = '';
      pill.textContent = (st.gamestate === 'HALFTIME') ? 'HALFTIME' : v.situation;
    }
    card.classList.toggle('collapsed', isFinal);
    card._frac = liveFraction(st);
    paintProjection(card);
    if (card._stats) refitStatLine(card._stats); // collapsed state changes the card width => re-measure
    paintTrail(card, p, st);
  }
  paintBottomBar();
}

// Timer loop around pollOnce. Returns { stop() }. While only WAIT games remain it just sleeps (re-planning
// locally at most every MAX_SLEEP_MS, no network); stops itself when every relevant game is DONE.
function startPoller(cfg, games, setStatus) {
  let stopped = false, timer = null;
  const state = { cfg: cfg, games: games, statsByGame: {}, statesByGame: {}, finalFetched: {}, lastPoints: {}, lastScoresMs: Date.now() };
  const deps = {
    now: function() { return Date.now(); },
    fetchGames: fetchGames,
    fetchGameStats: fetchGameStats,
    fetchGamePlays: fetchGamePlays,
    paint: function(pts, sts, tk) { if (!stopped) { paintPoints(pts); paintStates(state.cfg, state.games, sts); paintStatLines(computeStatLines(state.cfg, state.statsByGame, state.games)); paintTickers(tk); } }
  };
  async function tick() {
    if (stopped) return;
    let r;
    try { r = await pollOnce(state, deps); }
    catch (e) { r = { nextWakeMs: STATS_POLL_MS, done: false, polled: [], errors: [e.message] }; }
    if (stopped) return;
    const t = new Date().toLocaleTimeString('en-US');
    const head = r.done ? 'All games final' : (r.polled.length ? ('Polled ' + r.polled.length + ' game(s) at ' + t) : 'Waiting for kickoff');
    setStatus(head + (r.errors.length ? ' | errors: ' + r.errors.join('; ') : ''));
    if (r.done) return;
    timer = setTimeout(tick, Math.min(r.nextWakeMs, MAX_SLEEP_MS));
  }
  tick();
  return { stop: function() { stopped = true; if (timer) clearTimeout(timer); } };
}
function setScreenVw() {
  document.documentElement.style.setProperty('--screen-vw', (document.documentElement.clientWidth / 100) + 'px');
}

function mkEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildCard(p, cfg, games) {
  // Returns the reserved .pc-slot wrapper; the .player-card inside carries data-pid and the element refs
  // (_pill/_marker/_fill/_stats/_projEl/_proj/_side) the paint functions use.
  const card = mkEl('div', 'player-card collapsed');
  if (p.playerId) card.setAttribute('data-pid', p.playerId);
  card.style.setProperty('--pos-color', POSITION_COLORS[p.pos] || '#999');
  card._side = p.side;
  card._isDef = (p.pos === 'DEF' || p.slot === 'DEF');
  if (card._isDef) card.classList.add('is-def');
  const nameDiv = mkEl('div', 'pc-name');
  nameDiv.appendChild(mkEl('span', 'pc-name-text', p.empty ? '(empty)' : formatMatchupName(p)));
  nameDiv.appendChild(mkEl('span', 'pc-actual-pts', p.empty ? '' : '-')); // '-' until the game has state / points
  const parts = p.empty ? { when: '', opp: '' } : pregameParts(p.team, games);
  const stateDiv = mkEl('div', 'pc-game-state');
  stateDiv.appendChild(mkEl('span', 'pc-clock', ''));
  stateDiv.appendChild(mkEl('span', 'pc-score', parts.when));
  const oppLine = mkEl('div', 'pc-opp-line', parts.opp);
  card._opp = oppLine;
  const projEl = mkEl('span', 'pc-proj-pts', '');
  stateDiv.appendChild(projEl);
  card._projEl = projEl;
  card._proj = (!p.empty && p.projStats) ? leagueComputedProj(p.projStats, cfg.scoring) : null;
  if (card._proj != null) projEl.textContent = fmtPts(card._proj);
  card._projShown = card._proj;
  // Outer-edge tab: vertical #NUMBER (when known, from ESPN via attachJerseyNumbers; hidden when collapsed), TEAM, POS.
  const tab = mkEl('div', 'pc-tab');
  if (!p.empty && p.number) tab.appendChild(mkEl('span', 'pc-tab-num', '#' + p.number));
  tab.appendChild(mkEl('span', 'pc-tab-team', p.empty ? '' : (p.team || '')));
  tab.appendChild(mkEl('span', 'pc-tab-pos', p.empty ? (p.slot || '') : (p.pos || '')));
  // Trail row: track, fill, ball marker (one SVG with 3 shapes - right-pointing / left-pointing / plain circle; CSS
  // shows one - plus the team logo), and the pill (down & distance / situation text).
  const trail = mkEl('div', 'pc-trail');
  trail.appendChild(mkEl('div', 'pc-track'));
  const fill = mkEl('div', 'pc-fill ' + p.side);
  trail.appendChild(fill);
  const marker = mkEl('div', 'pc-marker ' + (p.side === 'own' ? 'dir-right' : 'dir-left'));
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 20 14');
  [['path', 'shape-r', 'M16,7 L11,2.528 A6,6 0 1,0 11,11.472 Z'],
   ['path', 'shape-l', 'M4,7 L9,2.528 A6,6 0 1,1 9,11.472 Z'],
   ['circle', 'shape-c', null]].forEach(function(s) {
    const shapeEl = document.createElementNS(svgNS, s[0]);
    shapeEl.setAttribute('class', s[1]);
    if (s[2]) { shapeEl.setAttribute('d', s[2]); } else { shapeEl.setAttribute('cx', '7'); shapeEl.setAttribute('cy', '7'); shapeEl.setAttribute('r', '6'); }
    svg.appendChild(shapeEl);
  });
  marker.appendChild(svg);
  if (!p.empty && p.team) {
    const logoImg = mkEl('img', 'pc-logo');
    logoImg.alt = '';
    logoImg.src = teamLogoUrl(p.team);
    const logoTxt = mkEl('span', 'pc-logo-fallback', p.team);
    logoImg.onerror = function() { logoImg.style.display = 'none'; logoTxt.style.display = 'block'; };
    marker.appendChild(logoImg);
    marker.appendChild(logoTxt);
  }
  trail.appendChild(marker);
  const pill = mkEl('div', 'pc-situation', '');
  trail.appendChild(pill);
  const stats = mkEl('div', 'pc-stats', '');
  card._pill = pill;
  card._marker = marker;
  card._fill = fill;
  card._stats = stats;
  const body = mkEl('div', 'pc-body');
  body.appendChild(nameDiv);
  body.appendChild(stateDiv);
  body.appendChild(oppLine);
  body.appendChild(trail);
  body.appendChild(stats);
  card.appendChild(tab);
  card.appendChild(body);
  const slot = mkEl('div', 'pc-slot');
  slot.appendChild(card);
  return slot;
}

// Cards per side = starters count; --mk = 1.56 at 9 cards (9 reserved 76u slots fill the 1080-tall screen), scaled
// down for more. Also makes sure the empty bottom-middle box exists inside #lane-matchup.
function renderCards(cfg, games) {
  const ownEl = document.getElementById('matchup-own');
  const oppEl = document.getElementById('matchup-opp');
  ownEl.innerHTML = '';
  oppEl.innerHTML = '';
  const n = Math.max(cfg.own.players.length, cfg.opp ? cfg.opp.players.length : 0, 1);
  const lane = document.getElementById('lane-matchup');
  lane.style.setProperty('--mk', String(Math.min(1.56, 1.56 * 9 / n)));
  if (!document.getElementById('bottom-box')) {
    const bb = mkEl('div');
    bb.id = 'bottom-box';
    lane.appendChild(bb);
  }
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    const host = side.side === 'own' ? ownEl : oppEl;
    side.players.forEach(function(p) { host.appendChild(buildCard(p, cfg, games)); });
  });
  paintBottomBar();
}
  // ==== END SHARED JS ====

  // ---- receiver glue (NOT part of the shared region) ----
  let poller = null;
  let startEpoch = 0;
  let active = false;
  let curInfo = null;
  let resizeBound = false;

  function isNonEmptyStr(v) { return (typeof v === 'string' && v.trim() !== '') || (typeof v === 'number' && isFinite(v)); }

  function normPlayer(p, side, seen) {
    if (!p || typeof p !== 'object') return null;
    if (p.empty === true) return { side: side, slot: typeof p.slot === 'string' ? p.slot : '?', playerId: null, empty: true };
    if (!isNonEmptyStr(p.playerId) || !isNonEmptyStr(p.name) || !isNonEmptyStr(p.pos)) return null;
    const id = String(p.playerId);
    if (seen[id]) return null;

  async function start(cfg) {

  }

    // Default lineup: NYG @ LAR, Week 2 MNF 2026, game_id 202610232 -- Cam Skattebo (RB),

    let PC_WEEK = null;

    // Compact Sleeper-style stat-line builder. Order mirrors the matchup-page
    // row anatomy documented in live-stats Finding 1 (RB form: CAR, YD, REC, YD, TD).
    // QB branch: CMP/ATT, pass YD, pass TD, then rushing.
    function formatStatLine(stats, position) {
      if (!stats) return '--';
      const parts = [];
      if (position === 'QB') {
        if (stats.pass_att) parts.push(`${stats.pass_cmp || 0}/${stats.pass_att} CMP`);
        if (stats.pass_yd) parts.push(`${stats.pass_yd} YD`);
        if (stats.pass_td) parts.push(`${stats.pass_td} TD`);
        if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
        if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
        if (stats.rush_td) parts.push(`${stats.rush_td} TD`);
        return parts.length ? parts.join(', ') : '--';
      }
      if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
      if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
      if (stats.rec_tgt || stats.rec) parts.push(`${stats.rec || 0}/${stats.rec_tgt || 0} REC`);
      if (stats.rec_yd) parts.push(`${stats.rec_yd} YD`);
      const tds = (stats.rush_td || 0) + (stats.rec_td || 0);
      if (tds) parts.push(`${tds} TD`);
      return parts.length ? parts.join(', ') : '0 CAR';
    }

    // Compact delta line for the 10s ticker -- same key set, but only nonzero
    // per-play deltas (a play usually touches 1-3 keys, e.g. a run: rush_att+rush_yd).
    function formatDeltaLine(deltaStats, position) {
      const parts = [];
      if (position === 'QB') {
        if (deltaStats.pass_cmp) parts.push(`+${deltaStats.pass_cmp} CMP`);
        if (deltaStats.pass_yd) parts.push(`${deltaStats.pass_yd >= 0 ? '+' : ''}${deltaStats.pass_yd} YD`);
        if (deltaStats.pass_td) parts.push(`+${deltaStats.pass_td} TD`);
        if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
        if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
        if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
        return parts.length ? parts.join(', ') : null;
      }
      if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
      if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
      if (deltaStats.rec) parts.push(`+${deltaStats.rec} REC`);
      // +TGT ticker line (2026-09-23 port from debug-cards.html): gated on !rec so a completed
      // catch doesn't double-print "+1 REC" and "+1 TGT" for the same play -- a target that
      // wasn't caught is the only case needing its own line.
      if (deltaStats.rec_tgt && !deltaStats.rec) parts.push(`+${deltaStats.rec_tgt} TGT`);
      if (deltaStats.rec_yd) parts.push(`${deltaStats.rec_yd >= 0 ? '+' : ''}${deltaStats.rec_yd} YD`);
      if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
      if (deltaStats.rec_td) parts.push(`+${deltaStats.rec_td} TD`);
      return parts.length ? parts.join(', ') : null;
    }

    // Per-player ticker state lives in pcCards[playerId], NOT module-level vars.

    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];

      return n + (s[(v - 20) % 10] || s[v] || s[0]);

    // Live only ever has plays up to now, so there is no forward search for the NEWEST play; this
    // classifies it directly. Kept byte-for-byte in lockstep with index.html's copy.
    function specialLabelForPlay(m) {
      if (m.play_type === 'kickoff' || m.play_type === 'kickoff_touchback' || m.play_type === 'kickoff_muffed') {
        return (m.team || m.possession) + ' Kickoff';
      }
      if (m.play_type === 'extra_point' || m.play_type === 'two_point_conversion' || m.play_type === 'two_point_attempt') {
        return (m.team || m.possession) + ' Extra Point';
      }
      if (m.play_type === 'field_goal' && /is GOOD/i.test(m.description || '')) {
        return (m.team || m.possession) + ' Kickoff';
      }
      return null;
    }
    function terminalPhaseLabelForPlay(m) {
      if (m.play_type === 'game_over') return 'Final';
      if (m.play_type === 'period_end' && m.quarter_name === '2') return 'Halftime';
      return null;

    // deriveCurrentState(plays): plays is the newest-first array from the genius endpoint. Returns
    // { clockStr, awayPts, homePts, possession, specialLabel, endZone, down, distance, fieldTeam,
    // fieldYards, gamestate: 'LIVE'|'HALFTIME'|'FINAL' }. Terminal phases first, then the
    // specialLabel check BEFORE is_scoring_play/endZone (extra_point/made-FG also carry
    // is_scoring_play:true and would otherwise be mis-tagged endZone -- same ordering debug uses),
    // else the existing 2026-09-21c down/distance LOOKAHEAD (nearest down-bearing play NEWER than
    // statePlay, since a record's down/distance is pre-snap while its clock reads post-play).
    function deriveCurrentState(plays) {
      const newest = plays[0];
      const nm = newest.metadata || {};

      const term = terminalPhaseLabelForPlay(nm);
      if (term === 'Final') {
        return { clockStr: '', gamestate: 'FINAL', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
      }
      if (term === 'Halftime') {
        return { clockStr: 'Halftime', gamestate: 'HALFTIME', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
      }

      let statePlay = plays.find(p => p.metadata && p.metadata.down) || newest;
      const m = statePlay.metadata || {};

        ? `Q${m.quarter_name} ${m.time_remaining_minutes}:${String(m.time_remaining_seconds).padStart(2, '0')}`
        : '--';

      const awayPts = nm.away_points;
      const homePts = nm.home_points;

      const label = specialLabelForPlay(nm);
      if (label) {
        return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.possession, specialLabel: label, endZone: false, down: null, distance: null };
      }
      if (nm.is_scoring_play) {
        return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.possession, specialLabel: null, endZone: true, down: null, distance: null };
      }

      const statePlayIdx = plays.indexOf(statePlay);

      }

        clockStr, gamestate: 'LIVE', awayPts, homePts,
        possession: situationSourceMeta.possession || m.possession,
        specialLabel: null, endZone: false,
        down: situationSourceMeta.down, distance: situationSourceMeta.distance,
        fieldTeam: situationSourceMeta.yard_line_territory, fieldYards: situationSourceMeta.yard_line

    }

    // ---- Pregame data source (2026-09-23 port; Q2/Q2a/Q2b confirmed) ----
    // Sleeper's public /scores/nfl/{seasonType}/{season}/{week} (no auth) returns the week's games;
    // each has top-level `date` + `.metadata.{game_key,away_team,home_team,has_started,is_in_progress,
    // is_over}`. Used ONLY for the pregame VS/@ line since plays[] is empty before kickoff. Week comes
    // from PC_WEEK (user-set on the sender page, delivered via CONFIG). Time is FIXED ET regardless of
    // viewer (Q2b). Returns null when week is unset / game not found / fetch fails.
    let pregameInfo = null;
    async function fetchPregameInfo() {
      if (!PC_WEEK) return null;
      try {
        const res = await fetch(
          `https://api.sleeper.app/scores/nfl/${PC_SEASON_TYPE}/${PC_SEASON}/${PC_WEEK}`,
          { cache: 'no-store' }
        );
        const games = await res.json();
        const game = (games || []).find(g => g.metadata && g.metadata.game_key &&
          g.metadata.away_team === PC_AWAY_TEAM && g.metadata.home_team === PC_HOME_TEAM);
        if (!game) return null;

        if (game.date) {
          const d = new Date(game.date);

            const day = d.toLocaleString('en-US', { weekday: 'short', timeZone: 'America/New_York' });

            dayTime = `${day} ${time} ET`;

          hasStarted: !!(game.metadata && game.metadata.has_started),

        const state = deriveCurrentState(plays);

        // Cumulative stats: PRIMARY SOURCE = sportradar /stats/nfl/game/<id> row -- a true
        // whole-game cumulative total, unaffected by genius's limit=25 play-window bug
        // (confirmed 2026-09-20, see project Findings).
        let statsData = [];
        try {
          statsData = await statsRes.json();

        if (myEpoch !== pcConfigEpoch) return; // config changed while stats were in flight -- drop it

        // Paint each card from the SAME two responses already in hand: 3 players cost exactly
        // the same 2 requests as 1.
        Object.keys(pcCards).forEach(function(playerId) {
          const card = pcCards[playerId];

          // Clock: blank on FINAL (result line carries it), literal 'Halftime' on HALFTIME, live
          // Q#/clock otherwise -- all already resolved into state.clockStr by deriveCurrentState.
          card.clockEl.textContent = specialState === 'FINAL' ? '' : clockStr;

          // Score line, per-card perspective, OWN team's score first (no team prefix -- the ordering
          // conveys whose is whose). card.team decides which of away/home is "own". Feed mapping is
          // already correct as-is: away_points = PC_AWAY_TEAM's score, home_points = PC_HOME_TEAM's.
          const isHome = card.team === PC_HOME_TEAM;
          const ownScore = isHome ? state.homePts : state.awayPts;
          const oppScore = isHome ? state.awayPts : state.homePts;
          const oppTeamAbbr = isHome ? PC_AWAY_TEAM : PC_HOME_TEAM;
          const vsOrAt = isHome ? 'VS' : '@';
          let scoreStr;
          if (state.gamestate === 'FINAL' && ownScore != null && oppScore != null) {
            const result = ownScore > oppScore ? 'W' : (ownScore < oppScore ? 'L' : 'T');
            scoreStr = `${result} ${ownScore} - ${oppScore} ${vsOrAt} ${oppTeamAbbr}`;
          } else if (ownScore != null && oppScore != null) {
            scoreStr = `${ownScore} - ${oppScore}`;
          } else {
            scoreStr = '--';
          }
          card.scoreEl.textContent = scoreStr;

          // Possession indicator (.pc-poss) REMOVED per port scope (superseded by the on-Defense /
          // down-distance perspective line). Element kept in the DOM (minimal-diff), always hidden.
          card.possEl.style.display = 'none';
          card.possEl.textContent = '';

          // Situation line, per-card perspective, priority: specialLabel > (endZone && own possession
          // -> 'End Zone') > (opponent possession -> '${team} on Defense') > down/distance > '--'.
          // Row HIDDEN (not blanked) in HALFTIME/FINAL, restored as soon as play resumes.
          card.sitEl.style.display = specialState ? 'none' : '';
          let situationStr;
          if (state.specialLabel) {
            situationStr = state.specialLabel;
          } else if (state.endZone && state.possession === card.team) {
            situationStr = 'End Zone';
          } else if (state.possession && state.possession !== card.team) {
            situationStr = `${card.team} on Defense`;
          } else if (state.down && state.distance != null) {
            situationStr = `${ordinal(state.down)} & ${state.distance} @ ${state.fieldTeam || ''} ${state.fieldYards != null ? state.fieldYards : ''}`.trim();
          } else {
            situationStr = '--';
          }
          card.sitEl.textContent = situationStr;

          const playerStatsRow = (statsData || []).find(r => r.player_id === playerId);
          card.statsEl.textContent = formatStatLine(playerStatsRow ? playerStatsRow.stats : null, card.position);

          // Ticker: still genius-sourced -- only ever needs the SINGLE most recent play FOR THIS
          // PLAYER, which is always within the limit=25 window. Settle policy: only fires on a
          // new CONFIRMED play sequence.
          const playerPlays = plays.filter(p =>
            p.play_stats && p.play_stats.some(ps => ps.player && ps.player.player_id === playerId)
          );
          const mostRecentPlayerPlay = playerPlays.find(p => p.metadata && p.metadata.play_state === 'confirmed');

          if (mostRecentPlayerPlay) {
            const ps = mostRecentPlayerPlay.play_stats.find(x => x.player && x.player.player_id === playerId);
            const seq = mostRecentPlayerPlay.sequence;
            if (!card.baselineSeeded) {
              card.lastTickerSequence = seq;
              card.baselineSeeded = true;
            } else if (seq !== card.lastTickerSequence) {
              card.lastTickerSequence = seq;
              const deltaLine = formatDeltaLine(ps.stats || {}, card.position);
              if (deltaLine) showTicker(card, deltaLine);
            }
          }
        });
      } catch (e) {
        // ignore transient fetch errors -- next 3s poll will retry
      }
    }

    pollPlayerCard();
    setInterval(pollPlayerCard, PC_POLL_MS);

    // ---- R1 CONFIG + R3 STATE_SYNC over the custom namespace ----
    // Validate BEFORE applying anything: a partial/garbled CONFIG must never half-update the cards.
    function isNonEmpty(v) {
      return (typeof v === 'string' && v.trim() !== '') || (typeof v === 'number' && isFinite(v));
    }

    function currentConfig() {
      return { gameId: PC_GAME_ID, awayTeam: PC_AWAY_TEAM, homeTeam: PC_HOME_TEAM, week: PC_WEEK, players: PC_PLAYERS };
    }

    // CONFIG shape (matches index.html PC_CONFIG): { gameId, awayTeam, homeTeam, week,
    // players: [{ playerId, playerName, position, team }, ...] }. Every field and every player entry
    // must validate or the WHOLE config is rejected and the current lineup stays untouched.
    // `team` is REQUIRED per player (per-card own-score-first + on-Defense depend on it; a player
    // without one would silently mis-render, so reject instead). `week` is deliberately NOT in the
    // required-field check: null is a LEGAL value (user hasn't set it yet on the sender page) and
    // must not reject the whole config -- it is normalized below to a positive integer or null.
    function applyConfig(cfg) {
      const valid = cfg
        && ['gameId', 'awayTeam', 'homeTeam'].every(k => isNonEmpty(cfg[k]))
        && Array.isArray(cfg.players)
        && cfg.players.length > 0
        && cfg.players.every(p => p && isNonEmpty(p.playerId) && isNonEmpty(p.playerName) && isNonEmpty(p.position) && isNonEmpty(p.team));
      if (!valid) {
        console.warn('CONFIG rejected (missing/empty field or bad players[]), keeping current config', cfg);
        return false;
      }
      const newPlayers = cfg.players.map(p => ({
        playerId: String(p.playerId),
        playerName: String(p.playerName),
        position: String(p.position),
        team: String(p.team)
      }));
      // Duplicate playerIds would collide as pcCards keys and silently drop a card -- reject.
      if (new Set(newPlayers.map(p => p.playerId)).size !== newPlayers.length) {
        console.warn('CONFIG rejected (duplicate playerId in players[]), keeping current config', cfg);
        return false;
      }
      if (window.MatchupMode) window.MatchupMode.stop(); // S4.1: a valid 3-card CONFIG leaves matchup mode
      const sameTarget = String(cfg.gameId) === PC_GAME_ID
        && JSON.stringify(newPlayers) === JSON.stringify(PC_PLAYERS);
      PC_GAME_ID = String(cfg.gameId);
      PC_AWAY_TEAM = String(cfg.awayTeam);
      PC_HOME_TEAM = String(cfg.homeTeam);
      const wk = parseInt(cfg.week, 10);
      PC_WEEK = Number.isFinite(wk) && wk > 0 ? wk : null;
      PC_PLAYERS = newPlayers;
      pcHasConfig = true;
      pcConfigEpoch++; // invalidates any poll already in flight under the old config

      if (!sameTarget) {
        // New game/lineup: rebuild the cards. Fresh cards start with baselineSeeded=false, so the
        // new players' already-existing latest plays do NOT fire false tickers, and the old
        // players' tickers/timers are cleared by buildCards().
        buildCards();
      }
      pollPlayerCard(); // repaint now instead of waiting up to PC_POLL_MS
      return true;
    }

    // Namespaces must be declared BEFORE start() (Google's migration guide: via a message listener
    // and/or CastReceiverOptions.customNamespaces) -- we do both. Exactly ONE listener.
    // FAIL-SOFT: Google's reference says addCustomMessageListener throws if the system is not
    // ready or the namespace is unsupported, and it is NOT verified that calling it before
    // start() is accepted on this receiver. A throw here would abort the script before
    // context.start() and the whole receiver (video + cards) would die -- far worse than R1/R3
    // not working. So the registration is caught; on failure the cards keep their default
    // config and start() still runs.
    const receiverOptions = new cast.framework.CastReceiverOptions();
    receiverOptions.customNamespaces = {};
    receiverOptions.customNamespaces[CAST_NAMESPACE] = cast.framework.system.MessageType.JSON;

    // playbackConfig tuning (2026-09-21): some captured live sources (see project Findings --
    // "diagnose Chromecast receiver buffering loop") expose an unusually thin live window
    // (as few as ~4 segments / ~15s total buffer depth). CAF's stock default resume threshold
    // can require more buffered segments than a stream like that will ever provide, causing a
    // perpetual auto-pause/auto-resume cycle (black screen, seekbar fill-and-reset). Lowering
    // autoResumeNumberOfSegments lets playback resume with fewer segments in hand. Diagnostic
    // only -- does not fix the underlying thin-window source, just makes CAF more tolerant of it.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeNumberOfSegments = 2; // S4.4b (2026-10-02): was 1 (887c622); 2 still fits the thinnest window we cast (4 segs)
    receiverOptions.playbackConfig = playbackConfig;

    // S4.4b stall watchdog (2026-10-02): on-TV stalls were a slow segment fetch (13.8s vs ~0.3s typical)
    // draining a thin near-live buffer, then the player replaying segments. If BUFFERING lasts longer
    // than STALL_MS: 1st recovery = seek to the live edge, later ones = reload the current media.
    // At most STALL_MAX_RECOVERIES per STALL_WINDOW_MS, then it stops intervening. Reset on PLAYING
    // or when buffering ends. FAIL-SOFT: wrapped so a failure here can never abort the script before
    // context.start().
    try {
      const STALL_MS = 8000;
      const STALL_MAX_RECOVERIES = 3;
      const STALL_WINDOW_MS = 60000;
      const stallPlayerMgr = context.getPlayerManager();
      let stallTimer = null;
      let stallStage = 0;
      let stallRecoveryTimes = [];

      const stallClear = (resetStage) => {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        if (resetStage) stallStage = 0;
      };
      const stallArm = () => {
        stallClear(false);
        stallTimer = setTimeout(stallRecover, STALL_MS);
      };
      const stallRecover = () => {
        stallTimer = null;
        const now = Date.now();
        stallRecoveryTimes = stallRecoveryTimes.filter((t) => now - t < STALL_WINDOW_MS);
        if (stallRecoveryTimes.length >= STALL_MAX_RECOVERIES) {
          console.warn('stall watchdog: recovery cap reached, not intervening further for now');
          return;
        }
        stallRecoveryTimes.push(now);
        try {
          if (stallStage === 0) {
            const range = stallPlayerMgr.getLiveSeekableRange();
            if (range && Number.isFinite(range.end)) {
              const start = Number.isFinite(range.start) ? range.start : 0;
              stallPlayerMgr.seek(Math.max(start, range.end - 2));
              console.warn('stall watchdog: seek to live edge');
            }
          } else {
            const mediaInfo = stallPlayerMgr.getMediaInformation();
            if (mediaInfo) {
              const req = new cast.framework.messages.LoadRequestData();
              req.media = mediaInfo;
              req.autoplay = true;
              Promise.resolve(stallPlayerMgr.load(req)).catch((e) => console.error('stall watchdog: reload failed', e));
              console.warn('stall watchdog: reload media');
            }
          }
        } catch (err) {
          console.error('stall watchdog: recovery step failed', err);
        }
        stallStage++;
        stallArm(); // still buffering after this step -> escalate after another STALL_MS
      };

      stallPlayerMgr.addEventListener(cast.framework.events.EventType.BUFFERING, (e) => {
        if (e && e.isBuffering) { if (!stallTimer) stallArm(); }
        else stallClear(true);
      });
      stallPlayerMgr.addEventListener(cast.framework.events.EventType.PLAYING, () => stallClear(true));
      console.log('diag: stall watchdog armed (STALL_MS=' + STALL_MS + ', max ' + STALL_MAX_RECOVERIES + ' recoveries per ' + STALL_WINDOW_MS + ' ms)');
    } catch (err) {
      console.error('stall watchdog setup failed; playback unaffected', err);
    }

    try {
      context.addCustomMessageListener(CAST_NAMESPACE, (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'CONFIG') {
          if (msg.mode === 'matchup' && window.MatchupMode) {
            pcConfigEpoch++; // S4.1: discard any in-flight single-game poll
            window.MatchupMode.applyConfig(msg);
          } else {
            applyConfig(msg);
          }
        } else if (msg.type === 'STATE_REQUEST') {
          // Reply to THIS sender only: sendCustomMessage is documented as per-sender, no broadcast.
          context.sendCustomMessage(CAST_NAMESPACE, event.senderId, {
            type: 'STATE_SYNC',
            hasConfig: pcHasConfig || !!(window.MatchupMode && window.MatchupMode.info().active),
            mode: (window.MatchupMode && window.MatchupMode.info().active) ? 'matchup' : 'players',
            matchup: window.MatchupMode ? window.MatchupMode.info() : null,
            config: currentConfig()
          });
        }
      });
    } catch (err) {
      console.error('custom-namespace listener registration failed; CONFIG/STATE_SYNC disabled, defaults in effect', err);
    }

    context.start(receiverOptions);
  </script>
</body>
</html>

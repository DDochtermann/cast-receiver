<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>stream-overlay receiver</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; }
  cast-media-player { width: 100%; height: 100%; }

  .player-cards {
    position: absolute; bottom: 0; left: 0;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    z-index: 10;
  }
  .player-card {
    width: 380px;
    background: rgba(0,0,0,0.85);
    border-radius: 0 20px 0 0;
    padding: 18px 22px;
    color: #fff;
    font-size: 22px;
    box-sizing: border-box;
  }
  .player-card .pc-name {
    color: #f0b429;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .player-card .pc-game-state {
    font-size: 19px;
    color: #ccc;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .player-card .pc-situation {
    font-size: 19px;
    color: #aaa;
    margin-bottom: 14px;
  }
  .player-card .pc-stats {
    font-size: 23px;
    font-weight: 600;
    color: #fff;
    border-top: 1px solid #333;
    padding-top: 10px;
  }
  .player-card .pc-ticker {
    margin-top: 10px;
    min-height: 28px;
    font-size: 21px;
    font-weight: 700;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .player-card .pc-ticker.visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="stage">
    <cast-media-player></cast-media-player>

    <div class="player-cards" id="player-cards"></div>
  </div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // ---- Live player-stat cards (Sleeper-sourced, no backend/proxy needed) ----
    // Multi-card port (2026-09-21) of public/index.html's 3-card logic. Sleeper's endpoints are
    // public/unauthenticated, so the receiver -- an embedded browser on the Chromecast itself --
    // can fetch them directly, same as the sender does. ONE fetch pair per poll is shared by all
    // cards: game state (clock/score/possession/down-distance) is game-wide, only the stat row
    // and ticker are per-player.
    // Test-config DEFAULTS. `let` (not const) because the sender can replace them at runtime with
    // a CONFIG message (R1), so one hosted receiver serves any game/lineup instead of needing an
    // edit + redeploy per game. A receiver that never gets a CONFIG shows these defaults.
    // Default lineup: NYG @ LAR, Week 2 MNF 2026, game_id 202610232 -- Cam Skattebo (RB),
    // Isaiah Likely (TE), Matthew Stafford (QB).
    let PC_GAME_ID = '202610232';
    const PC_SEASON = 2026;
    const PC_SEASON_TYPE = 'regular';
    let PC_AWAY_TEAM = 'NYG';
    let PC_HOME_TEAM = 'LAR';
    let PC_PLAYERS = [
      { playerId: '12481', playerName: 'Cam Skattebo', position: 'RB' },
      { playerId: '8131', playerName: 'Isaiah Likely', position: 'TE' },
      { playerId: '421', playerName: 'Matthew Stafford', position: 'QB' }
    ];
    const PC_POLL_MS = 3000;
    const PC_TICKER_DISPLAY_MS = 10000;

    // Bumped on every accepted CONFIG. An in-flight poll captures the value at its start and
    // discards its result if this changed while it was awaiting the network -- otherwise a poll
    // begun under the OLD lineup could paint stale data over the NEW lineup's cards.
    let pcConfigEpoch = 0;
    let pcHasConfig = false; // true once a valid CONFIG has been applied (reported in STATE_SYNC)

    // Custom message channel shared with the sender (index.html CAST_NAMESPACE).
    const CAST_NAMESPACE = 'urn:x-cast:com.streamoverlay.status';

    // ---- Card container: rebuilt from PC_PLAYERS whenever the lineup/game changes. ----
    // pcCards[playerId] holds the element refs + PER-PLAYER ticker state, so one player's play
    // can never suppress or trigger another player's ticker.
    const playerCardsEl = document.getElementById('player-cards');
    let pcCards = {};

    function buildCards() {
      // Clear any pending ticker timers from the old cards before discarding them.
      Object.keys(pcCards).forEach(function(id) {
        if (pcCards[id].tickerHideTimer) clearTimeout(pcCards[id].tickerHideTimer);
      });
      playerCardsEl.innerHTML = '';
      pcCards = {};
      PC_PLAYERS.forEach(function(p) {
        const card = document.createElement('div');
        card.className = 'player-card';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'pc-name';
        nameDiv.textContent = p.playerName;
        const stateDiv = document.createElement('div');
        stateDiv.className = 'pc-game-state';
        const clockSpan = document.createElement('span');
        clockSpan.className = 'pc-clock';
        clockSpan.textContent = '--';
        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'pc-score';
        scoreSpan.textContent = '--';
        const possSpan = document.createElement('span');
        possSpan.className = 'pc-poss';
        possSpan.textContent = '--';
        stateDiv.appendChild(clockSpan);
        stateDiv.appendChild(scoreSpan);
        stateDiv.appendChild(possSpan);
        const sitDiv = document.createElement('div');
        sitDiv.className = 'pc-situation';
        sitDiv.textContent = '--';
        const statsDiv = document.createElement('div');
        statsDiv.className = 'pc-stats';
        statsDiv.textContent = '--';
        const tickerDiv = document.createElement('div');
        tickerDiv.className = 'pc-ticker';
        card.appendChild(nameDiv);
        card.appendChild(stateDiv);
        card.appendChild(sitDiv);
        card.appendChild(statsDiv);
        card.appendChild(tickerDiv);
        playerCardsEl.appendChild(card);
        pcCards[p.playerId] = {
          playerName: p.playerName,
          position: p.position,
          clockEl: clockSpan,
          scoreEl: scoreSpan,
          possEl: possSpan,
          sitEl: sitDiv,
          statsEl: statsDiv,
          tickerEl: tickerDiv,
          tickerHideTimer: null,
          lastTickerSequence: null,
          baselineSeeded: false
        };
      });
    }
    buildCards();

    // Compact Sleeper-style stat-line builder. Order mirrors the matchup-page
    // row anatomy documented in live-stats Finding 1 (RB form: CAR, YD, REC, YD, TD).
    // QB branch: CMP/ATT, pass YD, pass TD, then rushing.
    function formatStatLine(stats, position) {
      if (!stats) return '--';
      const parts = [];
      if (position === 'QB') {
        if (stats.pass_att) parts.push(`${stats.pass_cmp || 0}/${stats.pass_att} CMP`);
        if (stats.pass_yd) parts.push(`${stats.pass_yd} YD`);
        if (stats.pass_td) parts.push(`${stats.pass_td} TD`);
        if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
        if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
        if (stats.rush_td) parts.push(`${stats.rush_td} TD`);
        return parts.length ? parts.join(', ') : '--';
      }
      if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
      if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
      if (stats.rec_tgt || stats.rec) parts.push(`${stats.rec || 0}/${stats.rec_tgt || 0} REC`);
      if (stats.rec_yd) parts.push(`${stats.rec_yd} YD`);
      const tds = (stats.rush_td || 0) + (stats.rec_td || 0);
      if (tds) parts.push(`${tds} TD`);
      return parts.length ? parts.join(', ') : '0 CAR';
    }

    // Compact delta line for the 10s ticker -- same key set, but only nonzero
    // per-play deltas (a play usually touches 1-3 keys, e.g. a run: rush_att+rush_yd).
    function formatDeltaLine(deltaStats, position) {
      const parts = [];
      if (position === 'QB') {
        if (deltaStats.pass_cmp) parts.push(`+${deltaStats.pass_cmp} CMP`);
        if (deltaStats.pass_yd) parts.push(`${deltaStats.pass_yd >= 0 ? '+' : ''}${deltaStats.pass_yd} YD`);
        if (deltaStats.pass_td) parts.push(`+${deltaStats.pass_td} TD`);
        if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
        if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
        if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
        return parts.length ? parts.join(', ') : null;
      }
      if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
      if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
      if (deltaStats.rec) parts.push(`+${deltaStats.rec} REC`);
      if (deltaStats.rec_yd) parts.push(`${deltaStats.rec_yd >= 0 ? '+' : ''}${deltaStats.rec_yd} YD`);
      if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
      if (deltaStats.rec_td) parts.push(`+${deltaStats.rec_td} TD`);
      return parts.length ? parts.join(', ') : null;
    }

    // Per-player ticker state lives in pcCards[playerId], NOT module-level vars.
    function showTicker(card, text) {
      card.tickerEl.textContent = text;
      card.tickerEl.classList.add('visible');
      if (card.tickerHideTimer) clearTimeout(card.tickerHideTimer);
      card.tickerHideTimer = setTimeout(() => {
        card.tickerEl.classList.remove('visible');
      }, PC_TICKER_DISPLAY_MS);
    }

    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    async function pollPlayerCard() {
      const myEpoch = pcConfigEpoch; // see pcConfigEpoch: discard this poll if the config changes mid-flight
      try {
        const [playsRes, statsRes] = await Promise.all([
          fetch(
            `https://api.sleeper.app/plays/nfl/${PC_SEASON_TYPE}/${PC_SEASON}/game/${PC_GAME_ID}?limit=25&provider=genius`,
            { cache: 'no-store' }
          ),
          fetch(
            `https://api.sleeper.app/stats/nfl/game/${PC_GAME_ID}?season_type=${PC_SEASON_TYPE}&season=${PC_SEASON}`,
            { cache: 'no-store' }
          )
        ]);
        const playsData = await playsRes.json();
        if (myEpoch !== pcConfigEpoch) return;
        const plays = playsData.plays || [];
        if (!plays.length) return;

        // Newest play overall -- drives game-state fields (clock/score/down-distance/etc).
        // Admin markers (period_end/timeout/game_over/kickoff) carry no play_state and
        // often blank situational fields -- per live-stats Finding 15, walk forward to
        // the newest play that actually HAS down/distance rather than blanking the display.
        // EXCEPTION (2026-09-20): two terminal states override that hold-last-snap rule,
        // because the stale snap there is wrong, not just old: Q2 period_end = HALFTIME,
        // game_over = FINAL. Q1/Q3 period_end intentionally still hold the last snap
        // (down & distance is still accurate across those transitions -- user decision).
        const newestMeta = plays[0].metadata || {};
        const isHalftime = newestMeta.play_type === 'period_end' && Number(newestMeta.quarter_name) === 2;
        const isFinal = newestMeta.play_type === 'game_over';
        const specialState = isHalftime ? 'HALFTIME' : (isFinal ? 'FINAL' : null);

        let statePlay = plays.find(p => p.metadata && p.metadata.down) || plays[0];
        const m = statePlay.metadata || {};

        // Game-wide display strings, computed ONCE and painted onto every card.
        const clockStr = specialState
          ? specialState
          : ((m.quarter_name != null && m.time_remaining_minutes != null)
              ? `Q${m.quarter_name} ${m.time_remaining_minutes}:${String(m.time_remaining_seconds).padStart(2, '0')}`
              : '--');

        const awayPts = plays[0].metadata ? plays[0].metadata.away_points : undefined;
        const homePts = plays[0].metadata ? plays[0].metadata.home_points : undefined;
        const scoreStr = (awayPts != null && homePts != null) ? `${PC_AWAY_TEAM} ${awayPts} - ${PC_HOME_TEAM} ${homePts}` : '--';

        const possStr = m.possession ? `${m.possession} ball` : '--';
        const situationStr = (m.down && m.distance != null && m.yard_line != null)
          ? `${ordinal(m.down)} & ${m.distance} @ ${m.yard_line_territory || ''} ${m.yard_line}`.trim()
          : '--';

        // Cumulative stats: PRIMARY SOURCE = sportradar /stats/nfl/game/<id> row -- a true
        // whole-game cumulative total, unaffected by genius's limit=25 play-window bug
        // (confirmed 2026-09-20, see project Findings).
        let statsData = [];
        try {
          statsData = await statsRes.json();
        } catch (e) { /* leave empty, formatStatLine handles missing gracefully */ }
        if (myEpoch !== pcConfigEpoch) return; // config changed while stats were in flight -- drop it

        // Paint each card from the SAME two responses already in hand: 3 players cost exactly
        // the same 2 requests as 1.
        Object.keys(pcCards).forEach(function(playerId) {
          const card = pcCards[playerId];

          card.clockEl.textContent = clockStr;
          card.scoreEl.textContent = scoreStr;

          // Possession + situation rows are HIDDEN (not blanked) in the special states,
          // and restored as soon as play resumes.
          card.possEl.style.display = specialState ? 'none' : '';
          card.sitEl.style.display = specialState ? 'none' : '';
          card.possEl.textContent = possStr;
          card.sitEl.textContent = situationStr;

          const playerStatsRow = (statsData || []).find(r => r.player_id === playerId);
          card.statsEl.textContent = formatStatLine(playerStatsRow ? playerStatsRow.stats : null, card.position);

          // Ticker: still genius-sourced -- only ever needs the SINGLE most recent play FOR THIS
          // PLAYER, which is always within the limit=25 window. Settle policy: only fires on a
          // new CONFIRMED play sequence.
          const playerPlays = plays.filter(p =>
            p.play_stats && p.play_stats.some(ps => ps.player && ps.player.player_id === playerId)
          );
          const mostRecentPlayerPlay = playerPlays.find(p => p.metadata && p.metadata.play_state === 'confirmed');

          if (mostRecentPlayerPlay) {
            const ps = mostRecentPlayerPlay.play_stats.find(x => x.player && x.player.player_id === playerId);
            const seq = mostRecentPlayerPlay.sequence;
            if (!card.baselineSeeded) {
              card.lastTickerSequence = seq;
              card.baselineSeeded = true;
            } else if (seq !== card.lastTickerSequence) {
              card.lastTickerSequence = seq;
              const deltaLine = formatDeltaLine(ps.stats || {}, card.position);
              if (deltaLine) showTicker(card, deltaLine);
            }
          }
        });
      } catch (e) {
        // ignore transient fetch errors -- next 3s poll will retry
      }
    }

    pollPlayerCard();
    setInterval(pollPlayerCard, PC_POLL_MS);

    // ---- R1 CONFIG + R3 STATE_SYNC over the custom namespace ----
    // Validate BEFORE applying anything: a partial/garbled CONFIG must never half-update the cards.
    function isNonEmpty(v) {
      return (typeof v === 'string' && v.trim() !== '') || (typeof v === 'number' && isFinite(v));
    }

    function currentConfig() {
      return { gameId: PC_GAME_ID, awayTeam: PC_AWAY_TEAM, homeTeam: PC_HOME_TEAM, players: PC_PLAYERS };
    }

    // CONFIG shape (matches index.html PC_CONFIG): { gameId, awayTeam, homeTeam,
    // players: [{ playerId, playerName, position }, ...] }. Every field and every player entry
    // must validate or the WHOLE config is rejected and the current lineup stays untouched.
    function applyConfig(cfg) {
      const valid = cfg
        && ['gameId', 'awayTeam', 'homeTeam'].every(k => isNonEmpty(cfg[k]))
        && Array.isArray(cfg.players)
        && cfg.players.length > 0
        && cfg.players.every(p => p && isNonEmpty(p.playerId) && isNonEmpty(p.playerName) && isNonEmpty(p.position));
      if (!valid) {
        console.warn('CONFIG rejected (missing/empty field or bad players[]), keeping current config', cfg);
        return false;
      }
      const newPlayers = cfg.players.map(p => ({
        playerId: String(p.playerId),
        playerName: String(p.playerName),
        position: String(p.position)
      }));
      // Duplicate playerIds would collide as pcCards keys and silently drop a card -- reject.
      if (new Set(newPlayers.map(p => p.playerId)).size !== newPlayers.length) {
        console.warn('CONFIG rejected (duplicate playerId in players[]), keeping current config', cfg);
        return false;
      }
      const sameTarget = String(cfg.gameId) === PC_GAME_ID
        && JSON.stringify(newPlayers) === JSON.stringify(PC_PLAYERS);
      PC_GAME_ID = String(cfg.gameId);
      PC_AWAY_TEAM = String(cfg.awayTeam);
      PC_HOME_TEAM = String(cfg.homeTeam);
      PC_PLAYERS = newPlayers;
      pcHasConfig = true;
      pcConfigEpoch++; // invalidates any poll already in flight under the old config

      if (!sameTarget) {
        // New game/lineup: rebuild the cards. Fresh cards start with baselineSeeded=false, so the
        // new players' already-existing latest plays do NOT fire false tickers, and the old
        // players' tickers/timers are cleared by buildCards().
        buildCards();
      }
      pollPlayerCard(); // repaint now instead of waiting up to PC_POLL_MS
      return true;
    }

    // Namespaces must be declared BEFORE start() (Google's migration guide: via a message listener
    // and/or CastReceiverOptions.customNamespaces) -- we do both. Exactly ONE listener.
    // FAIL-SOFT: Google's reference says addCustomMessageListener throws if the system is not
    // ready or the namespace is unsupported, and it is NOT verified that calling it before
    // start() is accepted on this receiver. A throw here would abort the script before
    // context.start() and the whole receiver (video + cards) would die -- far worse than R1/R3
    // not working. So the registration is caught; on failure the cards keep their default
    // config and start() still runs.
    const receiverOptions = new cast.framework.CastReceiverOptions();
    receiverOptions.customNamespaces = {};
    receiverOptions.customNamespaces[CAST_NAMESPACE] = cast.framework.system.MessageType.JSON;

    try {
      context.addCustomMessageListener(CAST_NAMESPACE, (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'CONFIG') {
          applyConfig(msg);
        } else if (msg.type === 'STATE_REQUEST') {
          // Reply to THIS sender only: sendCustomMessage is documented as per-sender, no broadcast.
          context.sendCustomMessage(CAST_NAMESPACE, event.senderId, {
            type: 'STATE_SYNC',
            hasConfig: pcHasConfig,
            config: currentConfig()
          });
        }
      });
    } catch (err) {
      console.error('custom-namespace listener registration failed; CONFIG/STATE_SYNC disabled, defaults in effect', err);
    }

    context.start(receiverOptions);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>stream-overlay receiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; }
  cast-media-player { width: 100%; height: 100%; }

  .player-cards {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: flex-end;
    gap: calc(20 / 1920 * 100vw);
    padding-left: calc(20 / 1920 * 100vw);
    z-index: 10;
  }
  .player-card {
    width: calc(200 / 1920 * 100vw);
    background: rgba(0,0,0,0.85);
    border-radius: 0 calc(40 / 1920 * 100vw) 0 0;
    padding: calc(12 / 1920 * 100vw) calc(16 / 1920 * 100vw);
    color: #fff;
    font-size: calc(16 / 1920 * 100vw);
    box-sizing: border-box;
  }
  .player-card .pc-name {
    color: #f0b429;
    font-size: calc(19 / 1920 * 100vw);
    font-weight: 700;
    margin-bottom: calc(4 / 1920 * 100vw);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-game-state {
    font-size: calc(13 / 1920 * 100vw);
    color: #ccc;
    margin-bottom: calc(8 / 1920 * 100vw);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  .player-card .pc-situation {
    font-size: calc(13 / 1920 * 100vw);
    color: #aaa;
    margin-bottom: calc(10 / 1920 * 100vw);
  }
  .player-card .pc-stats {
    font-size: calc(15 / 1920 * 100vw);
    font-weight: 600;
    color: #fff;
    border-top: 1px solid #333;
    padding-top: calc(8 / 1920 * 100vw);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-ticker {
    margin-top: calc(8 / 1920 * 100vw);
    min-height: calc(20 / 1920 * 100vw);
    font-size: calc(14 / 1920 * 100vw);
    font-weight: 700;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-ticker.visible {
    opacity: 1;
  }
  /* ---- S4.1 matchup mode: region between the BEGIN/END markers is generated from matchup.html ---- */
  /* BEGIN SHARED CSS */
:root { --screen-vw: 1vw; }
  /* Bottom-middle box (2026-10-03): empty placeholder card peering in from the bottom edge of the screen, centered. 1100 x 30 at the 1920 reference, screen-scaled like the cards; card look (same bg), rounded TOP corners only (~12 card units). No content yet. */
  #bottom-box {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: calc(1100 / 1920 * (100 * var(--screen-vw)));
    height: calc(30 / 1920 * (100 * var(--screen-vw)));
    background: rgba(6, 12, 24, 0.72);
    border-radius: calc(18.7 / 1920 * (100 * var(--screen-vw))) calc(18.7 / 1920 * (100 * var(--screen-vw))) 0 0;
    box-sizing: border-box;
    pointer-events: none;
  }
  /* ---- Matchup card columns (2026-10-01, test-only layout) -- each team's 9 cards are
         stacked vertically (QB first, DEF last) flush against the left/right screen edges.
         ONE scale knob: --mk (default 1.8). --u is "one 1920-px unit scaled by --mk and by the
         screen width"; every card dimension below is calc(N * var(--u)), where N is the old
         per-1920 value, so changing --mk rescales the whole card (and its column) together.
         Column width = 95 units (the old per-card width at 18-across), height is content-driven.
         padding-top leaves room for the top card's above-card ticker (it floats at bottom:100%
         of its own card) so #lane-strip's overflow:hidden doesn't clip it. ---- */
  #lane-matchup {
    --mk: 1.8;
    /* Spacing knobs (2026-10-01, restored after the bottom-row condensing stripped them), all in
       1920-units x --u: --pad-y/--pad-x = padding inside each card, --gap = space between stacked
       cards (also the room the above-card ticker floats in), --stats-pad = space under the
       stats divider. Total column height must stay < 1080 units-of-screen: if cards overflow
       the screen bottom, lower --gap/--pad-y or --mk. */
    --pad-y: 5;
    --pad-x: 7;
    --gap: 5;
    --stats-pad: 3;
    --u: calc(var(--mk) / 1920 * (100 * var(--screen-vw)));
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
    box-sizing: border-box;
    padding-top: calc(var(--gap) * var(--u));
  }
  #lane-matchup .matchup-side {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) * var(--u));
    flex: 0 0 auto;
    width: calc(110 * var(--u));
  }
  #lane-matchup .player-card {
    flex: 0 0 auto;
    width: 100%;
    background: rgba(0,0,0,0.72);
    border-radius: calc(6 * var(--u));
    padding: calc(var(--pad-y) * var(--u)) calc(var(--pad-x) * var(--u));
    color: #fff;
    font-size: calc(11.715 * var(--u));
    box-sizing: border-box;
    position: relative;
  }
  #lane-matchup .player-card .pc-name {
    color: #fff;
    font-size: calc(11.376 * var(--u));
    font-weight: 700;
    margin-bottom: calc(1.5 * var(--u));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: baseline;
    gap: calc(4 * var(--u));
  }
  #lane-matchup .player-card .pc-name .pc-name-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  /* Actual fantasy points (2026-09-23): top-right on the name line, same font/size/weight
     as the name itself (color/size/weight inherited from .pc-name, no separate rule needed
     for those properties -- only flex-shrink to keep it from squeezing the name text when
     space is tight). */
  #lane-matchup .player-card .pc-name .pc-actual-pts {
    flex: 0 0 auto;
  }
  #lane-matchup .player-card .pc-game-state {
    font-size: calc(9.515 * var(--u));
    color: #ccc;
    margin-bottom: calc(4.84 * var(--u));
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  /* Projected fantasy points (2026-09-23): right-justified on the score/game-state line,
     bare number, same color/size as the rest of that line (inherits .pc-game-state). */
  #lane-matchup .player-card .pc-game-state .pc-proj-pts {
    flex: 0 0 auto;
  }
  #lane-matchup .player-card .pc-situation {
    font-size: calc(8.65 * var(--u));
    color: #aaa;
    margin-bottom: calc(6.05 * var(--u));
  }
  #lane-matchup .player-card .pc-stats {
    font-size: calc(9.515 * var(--u));
    font-weight: 400;
    color: #aaa;
    border-top: 1px solid #333;
    padding-top: calc(var(--stats-pad) * var(--u));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Field-position dot (2026-10-01, per user): the divider line above .pc-stats doubles as a
     mini field. .pc-field is a zero-height, full-content-width wrapper sitting right above
     .pc-stats (whose border-top IS the line) -- the dot is positioned on its top edge instead
     of inside .pc-stats because .pc-stats has overflow:hidden and would clip it. left% (set in
     JS) = progress along the line; centered on the line via translate(-50%,-50%). */
  #lane-matchup .player-card .pc-field {
    position: relative;
    height: 0;
    width: 100%;
  }
  #lane-matchup .player-card .pc-field-dot {
    position: absolute;
    top: 0.5px;
    left: 0;
    width: calc(5 * var(--u));
    height: calc(5 * var(--u));
    border-radius: 50%;
    background: #4ade80;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: left 0.3s ease, opacity 0.2s ease;
    pointer-events: none;
  }
  #lane-matchup .player-card .pc-field-dot.visible {
    opacity: 1;
  }
  #lane-matchup .player-card .pc-field-dot.no-anim {
    transition: none;
  }
  /* Ticker (2026-10-01, per user): the green new-points text now sits OUTSIDE the card, just to
     the right of it (left of it on the opp column, which is flush to the right screen edge),
     on the name / fantasy-points line, and shows only the signed FANTASY-POINTS delta of the
     play (e.g. +1.90), not stat names. Absolutely positioned off the card's own edge, so it
     takes no space inside the card. Only Skattebo/Likely (own column) ever get one live. */
  #lane-matchup .player-card .pc-ticker {
    position: absolute;
    left: 100%;
    top: calc((var(--pad-y) - 2) * var(--u));
    margin-left: calc(4 * var(--u));
    padding: calc(2 * var(--u)) calc(4 * var(--u));
    background: rgba(0,0,0,0.85);
    border-radius: calc(3 * var(--u));
    font-size: calc(12.64 * var(--u));
    font-weight: 700;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }
  #lane-matchup .matchup-side.opp .player-card .pc-ticker {
    left: auto;
    right: 100%;
    margin-left: 0;
    margin-right: calc(4 * var(--u));
  }
  #lane-matchup .player-card .pc-ticker.visible {
    opacity: 1;
  }
  /* ---- Card redesign v1 (2026-10-02, per user mockup; first pass, user will tweak) ----
     Overrides the earlier #lane-matchup card rules (same specificity, later wins). Knobs:
     --mk (overall scale; 1.8 -> 1.4 so 9 reserved slots fit the 1080-tall screen), --gap (space
     between slots), --slot-h-u (RESERVED slot height in 1920-units x --u = height of a LIVE
     card; a measured-by-eye guess, raise it if a live card overflows its slot). Card = flex row
     [tab | body]; the right (opp) column mirrors it (row-reverse). Position colors come from
     --pos-color (set per card in JS from POSITION_COLORS). */
/* Gap (top edge + between stacked slots) = 2px at the 1920 reference, independent of --mk: --gap is in --u units, so it is 2 / --mk. --mk 1.54 fills the 1080 height: 9 x 76u x 1.54 + 10 x 2px = ~1073px at 1920 wide (my estimate, unmeasured). */
#lane-matchup { --mk: 1.56; --gap: calc(0.5 / var(--mk)); --slot-h-u: 76; --pos-color: #999; }
#lane-matchup .matchup-side { width: calc(169 * var(--u)); } /* batch 3: expanded (live) card width 188u -> 169u (-10%) */
/* Live card (game in progress; .collapsed = PRE/FINAL, HALFTIME stays live): 1px position-colored border, drawn on every side EXCEPT the screen-edge side (left col: no left border; right col: no right border). All cards carry the same transparent 1px border so going live/final never shifts layout; live just colors it. */
/* Batch 9: the live-card border above was REMOVED. Live now only recolors the tab bars (--bar-color; pre/post-game bars stay plain gray #888) and pins the card to the top of its slot (collapsed cards are centered in the slot). */
#lane-matchup .player-card:not(.collapsed) { --bar-color: var(--pos-color); align-self: flex-start; }
#lane-matchup .pc-slot { height: calc(var(--slot-h-u) * var(--u)); flex: 0 0 auto; display: flex; }
#lane-matchup .player-card {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  padding: 0;
  background: rgba(6, 12, 24, 0.72);
  border: 1px solid transparent;
  border-left: 0;
  border-radius: 0 calc(12 * var(--u)) calc(12 * var(--u)) 0;
}
#lane-matchup .matchup-side.opp .player-card {
  flex-direction: row-reverse;
  border: 1px solid transparent;
  border-right: 0;
  border-radius: calc(12 * var(--u)) 0 0 calc(12 * var(--u));
}
#lane-matchup .pc-tab {
  flex: 0 0 auto;
  width: calc(12 * var(--u));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;
  margin: calc(4 * var(--u)) 0;
  padding: calc(1 * var(--u)) 0;
  border-right: 1px solid var(--bar-color, #888);
}
#lane-matchup .matchup-side.opp .pc-tab {
  border-right: none;
  border-left: 1px solid var(--bar-color, #888);
}
/* Tab text order is top-to-bottom #num, TEAM, POS on BOTH columns (right column no longer reversed). */
/* Actual fantasy points value only (not the projection): larger than the name (11.495u). .pc-name is baseline-aligned, so it stays on the name baseline. */
#lane-matchup .player-card .pc-name .pc-actual-pts { font-size: calc(17.424 * var(--u)); line-height: 1; }
#lane-matchup .pc-tab span {
  writing-mode: vertical-rl;
  font-size: calc(9.922 * var(--u));
  font-weight: 700;
  line-height: 1;
  color: #fff;
  white-space: nowrap;
}
#lane-matchup .pc-tab .pc-tab-pos { color: var(--pos-color); font-weight: 700; }
/* Left (own) column: vertical text reads bottom-to-top (rotate 180); element ORDER matches the right column (#num top, TEAM, POS bottom) so the two columns mirror. */
#lane-matchup .matchup-side:not(.opp) .pc-tab span { transform: rotate(180deg); }
#lane-matchup .player-card.collapsed .pc-tab-num { display: none; }
/* Collapsed (FINAL/PRE/HALFTIME): the colored tab line shrinks to just the text (mockup), centered in the card. */
#lane-matchup .player-card.collapsed .pc-tab { align-self: stretch; justify-content: space-between; gap: calc(4 * var(--u)); margin: calc(4 * var(--u)) 0; padding: calc(2 * var(--u)) 0; }
#lane-matchup .pc-body {
  flex: 1 1 auto;
  min-width: 0;
  padding: calc(3 * var(--u)) calc(6 * var(--u));
}
#lane-matchup .matchup-side.opp .player-card .pc-name { flex-direction: row-reverse; }
#lane-matchup .matchup-side.opp .player-card .pc-name .pc-name-text { text-align: right; }
#lane-matchup .player-card .pc-game-state { justify-content: flex-start; gap: calc(6 * var(--u)); margin-bottom: calc(1 * var(--u)); }
#lane-matchup .player-card .pc-game-state .pc-clock:empty { display: none; } /* empty clock (PRE/FINAL) must not leave a flex gap => no indent on the W/L/FINAL line */
/* Pregame line 3 (kickoff stays on line 2): 'VS DAL' / '@ DAL'. Only on collapsed cards, and empty (hidden) once the game has a state (live/final) or for a BYE. */
#lane-matchup .player-card .pc-opp-line { font-size: calc(9.515 * var(--u)); color: #ccc; margin-bottom: calc(1 * var(--u)); }
#lane-matchup .matchup-side.opp .player-card .pc-opp-line { text-align: right; }
#lane-matchup .player-card .pc-opp-line:empty, #lane-matchup .player-card:not(.collapsed) .pc-opp-line { display: none; }
#lane-matchup .player-card .pc-game-state .pc-proj-pts { margin-left: auto; }
#lane-matchup .matchup-side.opp .player-card .pc-game-state .pc-proj-pts { order: 0; margin-left: 0; margin-right: auto; }
#lane-matchup .matchup-side.opp .player-card .pc-game-state .pc-clock { order: 1; }
#lane-matchup .matchup-side.opp .player-card .pc-game-state .pc-score { order: 2; }
#lane-matchup .player-card .pc-stats { border-top: none; padding-top: calc(1 * var(--u)); line-height: 1.25; }
/* Active (non-collapsed) cards always reserve the full 4th (stat) line, even when the player has no stats yet. */
#lane-matchup .player-card:not(.collapsed) .pc-stats { min-height: 1.25em; }
/* Trail row (live cards only; .collapsed hides it): track = the field, fill = down-colored trail
   (brightest at the ball, fading toward the own goal line), marker = team logo, pill = the old
   .pc-situation text (down & distance / On Defense / End Zone / special label). */
#lane-matchup .pc-trail { position: relative; height: calc(22 * var(--u)); margin: 0 0 calc(1 * var(--u)); }
#lane-matchup .player-card.collapsed .pc-trail { display: none; }
#lane-matchup .pc-track {
  position: absolute; left: 0; right: 0; top: 50%;
  height: calc(6.5 * var(--u));
  transform: translateY(-50%);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: calc(6.5 * var(--u));
  box-sizing: border-box;
}
#lane-matchup .pc-fill {
  position: absolute; top: 50%;
  height: calc(4 * var(--u));
  transform: translateY(-50%);
  border-radius: calc(4 * var(--u));
  width: 0;
  transition: width 0.3s ease;
  pointer-events: none;
}
#lane-matchup .pc-fill.own { left: 0; }
#lane-matchup .pc-fill.opp { right: 0; }
#lane-matchup .pc-marker {
  position: absolute; top: 50%; left: 0;
  width: calc(22 * var(--u)); height: calc(22 * var(--u));
  transform: translate(-50%, -50%);
  box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: left 0.3s ease, opacity 0.2s ease;
  z-index: 2;
  pointer-events: none;
}
#lane-matchup .pc-marker.visible { opacity: 1; }
#lane-matchup .pc-marker .pc-logo { width: 75%; height: 75%; object-fit: contain; position: relative; z-index: 1; }
#lane-matchup .pc-marker .pc-logo-fallback { display: none; font-size: calc(10.285 * var(--u)); font-weight: 700; color: #fff; position: relative; z-index: 1; }
/* Batch 3: on a pointer-shaped marker the logo sits on the circle center, which reads off-center against the whole shape; nudge it ~1px (0.65u at --mk 1.56 on a 1920 screen) toward the point. Plain circle unaffected. */
#lane-matchup .pc-marker.dir-right:not(.plain) .pc-logo, #lane-matchup .pc-marker.dir-right:not(.plain) .pc-logo-fallback { transform: translateX(calc(0.65 * var(--u))); }
#lane-matchup .pc-marker.dir-left:not(.plain) .pc-logo, #lane-matchup .pc-marker.dir-left:not(.plain) .pc-logo-fallback { transform: translateX(calc(-0.65 * var(--u))); }
/* Marker body = ONE inline-SVG shape (circle + pointer as a single path: dark fill, 1px light outline, so the tip is part of the same outlined shape). viewBox 0 0 20 14: 1 unit = 1.0833u; circle r 6 (= the 13u marker box), center x=7 (right-pointing, tip x=19) / x=13 (left-pointing, tip x=1) / x=7 (plain circle). */
#lane-matchup .pc-marker svg { position: absolute; top: calc(-1.833 * var(--u)); width: calc(36.667 * var(--u)); height: calc(25.667 * var(--u)); overflow: visible; z-index: 0; pointer-events: none; }
#lane-matchup .pc-marker svg path, #lane-matchup .pc-marker svg circle { fill: #0b1630; stroke: rgba(255, 255, 255, 0.45); stroke-width: 1; vector-effect: non-scaling-stroke; display: none; }
#lane-matchup .pc-marker.dir-right svg { left: calc(-1.833 * var(--u)); }
#lane-matchup .pc-marker.dir-right svg .shape-r { display: inline; }
#lane-matchup .pc-marker.dir-left svg { left: calc(-12.833 * var(--u)); }
#lane-matchup .pc-marker.dir-left svg .shape-l { display: inline; }
#lane-matchup .pc-marker.plain svg { left: calc(-1.833 * var(--u)); }
#lane-matchup .pc-marker.plain svg .shape-r, #lane-matchup .pc-marker.plain svg .shape-l { display: none; }
#lane-matchup .pc-marker.plain svg .shape-c { display: inline; }
#lane-matchup .player-card .pc-situation {
  position: absolute; top: 50%;
  transform: translateY(-50%) scaleX(var(--pill-sx));
  margin: 0;
  padding: calc(1.8 * var(--u)) calc(6 * var(--u));
  font-size: calc(10.285 * var(--u));
  font-style: normal;
  color: #c4c4c4;
  background: rgba(6, 12, 24, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: calc(4 * var(--u));
  white-space: nowrap;
  z-index: 1;
  transition: left 0.3s ease, right 0.3s ease;
}
#lane-matchup .player-card .pc-situation.centered { transform: translate(-50%, -50%) scaleX(var(--pill-sx)); }
/* ---- Batch 8 (2026-10-03) ---- knobs: --collapse-u (collapsed card is this many units narrower than live; = the trail row's vertical collapse, 22u row + 1u margin), --pill-sx (horizontal condense of the down&distance pill; 1 = none). */
#lane-matchup { --collapse-u: 23; --pill-sx: 0.88; }
#lane-matchup .player-card.collapsed { width: calc(145 * var(--u)); align-self: center; } /* batch 3: collapsed width set absolutely, 132u -> 145u (+10%); vertically centered in the reserved slot */
#lane-matchup .matchup-side.opp .player-card.collapsed { margin-left: auto; }
/* Stat line: no ellipsis; an overflowing line scrolls as a looping marquee (JS adds .scrolling + --marq-dist/--marq-dur; two identical segments, pause at the start of each loop). */
#lane-matchup .player-card .pc-stats { text-overflow: clip; }
#lane-matchup .pc-stats-inner { display: inline-block; white-space: nowrap; }
#lane-matchup .pc-stats-seg { display: inline-block; }
/* Stat-line scroll (batch 10): ping-pong driven by the Web Animations API in refitStatLine (rest -> scroll to end -> hold -> scroll back); no CSS animation. */
/* Point delta: one .pc-delta per scoring play, spawned over the fantasy-points total (name line, inner edge of the body), same bg alpha as the card. 5s: fade in 0-1s (0-20%), rise 1.5 lines (1.5 x 1.2em) over 0-5s, fade out 4-5s (80-100%). The old outside-the-card .pc-ticker is retired (kept as an inert element). */
#lane-matchup .pc-body { position: relative; }
#lane-matchup .player-card .pc-ticker { display: none !important; }
#lane-matchup .player-card .pc-delta {
  position: absolute;
  top: calc(3 * var(--u));
  right: calc(3 * var(--u));
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  background: rgba(6, 12, 24, 0.72);
  border-radius: calc(3 * var(--u));
  font-size: calc(13.904 * var(--u));
  font-weight: 700;
  color: #4ade80;
  white-space: nowrap;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  animation: pc-delta-float 5s linear forwards;
}
#lane-matchup .matchup-side.opp .player-card .pc-delta { right: auto; left: calc(3 * var(--u)); }
/* Display tweaks (2026-10-04): negative deltas yellow-orange; defense cards never show the trail row; a team on defense shows the pill without the marker circle/logo; bottom-bar lineup sums (own left, opp mirrored right). */
#lane-matchup .player-card .pc-delta.neg { color: #ffb020; }
#lane-matchup .player-card.is-def .pc-trail { display: none; }
#lane-matchup .pc-marker.no-marker { display: none; }
#lane-matchup #bottom-box { display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 calc(14 * var(--u)); color: #fff; }
#lane-matchup #bottom-box .bb-side { display: flex; flex-direction: row; align-items: baseline; gap: calc(6 * var(--u)); }
#lane-matchup #bottom-box .bb-side.opp { flex-direction: row-reverse; }
#lane-matchup #bottom-box .bb-pts { font-size: calc(17.424 * var(--u)); font-weight: 700; line-height: 1; }
#lane-matchup #bottom-box .bb-proj { font-size: calc(9.515 * var(--u)); color: #ccc; line-height: 1; }
@keyframes pc-delta-float {
  0% { opacity: 0; transform: translateY(0); }
  2% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-3em); } /* batch 9: fade-in 0-0.1s (2%), rise 1.666x the old 1.8em */
}
#lane-matchup .no-anim { transition: none !important; }
/* Chakra Petch (Google Fonts <link> in <head>), all card text uppercase. */
#lane-matchup { font-family: 'Chakra Petch', sans-serif; text-transform: uppercase; }
  /* END SHARED CSS */
  /* receiver-only: hidden unless body.matchup-mode; sits above the video like .player-cards; resets the old
     top-level .pc-ticker props (margin-top/min-height/overflow) that the shared ticker rule does not override */
  #lane-matchup { display: none; z-index: 10; pointer-events: none; }
  body.matchup-mode #lane-matchup { display: flex; }
  body.matchup-mode #player-cards { display: none; }
  #lane-matchup .player-card .pc-ticker { margin-top: 0; min-height: 0; overflow: visible; text-overflow: clip; }
</style>
</head>
<body>
  <div class="stage">
    <cast-media-player></cast-media-player>

    <div class="player-cards" id="player-cards"></div>

    <!-- S4.1 matchup mode screen (hidden unless body.matchup-mode) -->
    <div id="lane-matchup">
      <div id="matchup-own" class="matchup-side own"></div>
      <div id="matchup-opp" class="matchup-side opp"></div>
    </div>
  </div>

  <script>
  // ---- S4.4d PLAYBACK DIAGNOSTICS (2026-10-02) -- OBSERVATION ONLY, no behavior change. ----
  // S4.4e (2026-10-02): console.log only (no per-line stack capture); Sleeper API timing (hdr / body read / JSON.parse) via a
  // semantically-identical Response.prototype.json shim applied ONLY to Sleeper responses; long-task attribution; and an
  // opt-in A/B switch window.__diag.pollOff (default OFF) that disables the receiver's own 3 s Sleeper poll.
  // Placed BEFORE the CAF script tag so window.fetch is wrapped before CAF/Shaka run. Every path is try/catch
  // guarded; the fetch wrapper returns the ORIGINAL promise untouched (logging by side-effect only).
  // Console lines are prefixed 'diag [Ns]' (N = seconds since this script ran). The last RING_MAX lines are also
  // kept in memory: run __diag.dump() in the receiver DevTools Console to reprint them as one block.
  (function () {
    try {
      var T0 = performance.now();
      var RING_MAX = 1500, RECENT_MAX = 60, SLOW_SEG_MS = 2000, HEARTBEAT_MS = 30000, LAG_WARN_MS = 750;
      var ring = [], recent = [], inflight = {}, segSeen = {}, segOrder = [], segLen = {};
      var slRecent = [], marks = [], pollLogged = false, pollOffInit = false;
      var sbList = [], lastAppendAt = 0, shakaPlayer = null, shakaEv = 0;
      var M = { apps: 0, done: 0, bytes: 0, aSum: 0, aMax: 0, aWin: 0, sMax: 0, sWin: 0, errs: 0, removes: 0, sbs: 0 };
      try { pollOffInit = localStorage.getItem('diag.pollOff') === '1'; } catch (e) {}
      var S = { stalls: 0, stallMs: 0, stallMsMax: 0, segReq: 0, segDone: 0, segSlow: 0, segDur: 0, segDurMax: 0,
                aborted: 0, failed: 0, dup: 0, plReq: 0, plGapMax: 0, lagMax: 0, lagWin: 0, lagCount: 0,
                longTasks: 0, longTaskMax: 0, long200: 0, errors: 0,
                slN: 0, slJson: 0, slHdrMax: 0, slReadMax: 0, slReadSum: 0, slReadWin: 0, slParseMax: 0, slParseSum: 0,
                slParseWin: 0, slBytes: 0, slOverlapMax: 0 };
      var video = null, pm = null, ep = null, playedOnce = false, reqId = 0;
      var lastPlAt = null, plPrevSeq = null, plSame = 0, lastPl = null, cafTries = 0, cfgLogged = false;

      function ts() { return ((performance.now() - T0) / 1000).toFixed(1); }
      function r1(n) { return (typeof n === 'number' && isFinite(n)) ? Math.round(n * 10) / 10 : n; }
      function J(o) { try { return JSON.stringify(o); } catch (e) { return String(o); } }

        var line = 'diag [' + ts() + 's] ' + (level === 'warn' ? '(warn) ' : (level === 'error' ? '(ERROR) ' : '')) + msg;
        ring.push(line);

        try { console.log(line); } catch (e) {}
      }
      function mark(s) { marks.push({ t: performance.now(), s: s }); if (marks.length > 150) marks.shift(); }

      // ---- D2/D3: snapshot of playback position / buffer / live-edge distance ----
      function liveRange() {

            if (r && isFinite(r.end)) return { start: isFinite(r.start) ? r.start : 0, end: r.end };

      }
      function reqState() {

        for (var id in inflight) { var r = inflight[id]; out.push(r.k + ' ' + Math.round(now - r.t) + 'ms'); }

      }
      function dumpRecent() {
        var tail = recent.slice(-8).map(function (r) {

            + (r.hdr !== undefined ? ' hdr ' + r.hdr : '') + (r.dur !== undefined ? ' dur ' + r.dur : '')
            + (r.len ? ' len ' + r.len : '') + ']';
        });

        var sl = slRecent.slice(-6).map(function (r) {
          return '[' + r.at + 's ' + r.what + ' hdr ' + (r.hdr === undefined ? '...' : r.hdr) + (r.read !== undefined ? ' read ' + r.read + ' parse ' + r.parse : '') + (r.len ? ' len ' + r.len : '') + ']';
        });
        if (sl.length) emit('log', 'recent sleeper (oldest->newest): ' + sl.join(' '));
        try { emit('log', 'mse state ' + J(mseState())); } catch (e) {}
        shakaStall();
      }

      // ---- D2: stall episodes (every one, however short) ----
      function epStart(why) {

        emit('warn', 'STALL #' + ep.n + ' start (' + why + ') ' + J(snap()));
        dumpRecent();
        ep.timer = setInterval(function () {

      }
      function epEnd(why) {

        ep = null;
      }
      function onVideoEvent(type) {
        try {
          if (type === 'playing') { playedOnce = true; if (ep) epEnd('playing'); else emit('log', 'playing ' + J(snap())); return; }
          if (type === 'waiting') {

            epStart('video waiting'); return;
          }
          if (type === 'seeking') { if (ep) ep.seeked = true; emit('log', 'seeking ' + J(snap())); return; }

          }

        } catch (e) {}
      }
      function attachVideo(v) {

          v.addEventListener(name, function () { onVideoEvent(name); });
        });
        emit('log', 'video element attached ' + J(snap()));
      }
      function findVideo(root, depth) {
        if (!root || depth > 6) return null;
        var v = root.querySelector ? root.querySelector('video') : null;
        if (v) return v;
        var all = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (var i = 0; i < all.length; i++) {
          var sr = all[i].shadowRoot;
          if (sr) { var f = findVideo(sr, depth + 1); if (f) return f; }

      }

      // ---- D1: CAF hooks + config/environment lines ----
      function logEnv(tag) {
        try {
          var info = { ua: navigator.userAgent };
          try { if (window.shaka && shaka.Player) info.shaka = shaka.Player.version; } catch (e) {}
          try { if (navigator.connection) info.net = { type: navigator.connection.effectiveType, downlink: navigator.connection.downlink, rtt: navigator.connection.rtt }; } catch (e) {}

          try { if (window.MediaSource) info.mseSupport = { mp2t: MediaSource.isTypeSupported('video/mp2t; codecs="avc1.64001f,mp4a.40.2"'), mp4: MediaSource.isTypeSupported('video/mp4; codecs="avc1.64001f,mp4a.40.2"') }; } catch (e) {}
          emit('log', 'env ' + tag + ' ' + J(info));

            emit('log', 'playbackConfig as applied ' + String(J(pm.getPlaybackConfig())).slice(0, 900));
          }
        } catch (e) {}
      }
      function hookCaf() {
        try {
          if (pm) return;
          if (!(window.cast && cast.framework && cast.framework.CastReceiverContext)) return;
          var p = cast.framework.CastReceiverContext.getInstance().getPlayerManager();
          var ET = cast.framework.events.EventType;
          if (ET.BUFFERING) p.addEventListener(ET.BUFFERING, function (e) { emit('log', 'CAF BUFFERING ' + (e && e.isBuffering) + ' ' + J(snap())); });
          if (ET.ERROR) p.addEventListener(ET.ERROR, function (e) { S.errors++; emit('error', 'CAF ERROR ' + J({ code: e && e.detailedErrorCode, reason: e && e.reason })); });
          if (ET.PLAYER_LOAD_COMPLETE) p.addEventListener(ET.PLAYER_LOAD_COMPLETE, function () { emit('log', 'CAF PLAYER_LOAD_COMPLETE ' + J(snap())); });

          emit('log', 'CAF player manager hooked');
          setTimeout(function () { logEnv('t+2s'); }, 2000);
          setTimeout(function () { logEnv('t+20s'); }, 20000);
        } catch (e) { emit('warn', 'CAF hook failed: ' + e); }
      }

      // ---- D4: request tracking (fetch wrapper = pass-through) ----
      function classify(url) {
        try {
          var u = new URL(url, location.href);
          if (u.hostname === 'api.sleeper.app') return 'sl';
          if (/gstatic\.com$/.test(u.hostname)) return null;
          var p = u.pathname;
          if (/\.m3u8$/i.test(p)) return 'pl';
          if (/\.(ts|m4s|mp4|aac|m4a|m4v|image|webp|cmfv|cmfa)$/i.test(p) || /\/m\/[^\/]+$/.test(p)) return 'seg';
        } catch (e) {}

      }
      function shortUrl(url) {
        try { var u = new URL(url, location.href); return u.hostname + '/..' + u.pathname.slice(-24); } catch (e) { return String(url).slice(-32); }
      }
      // ---- S4.4e: Sleeper API request timing (the receiver's own 3 s poll + matchup poll) ----
      function slWhat(url) {
        try {
          var p = new URL(url, location.href).pathname;
          if (/\/plays\//.test(p)) return 'plays';
          if (/\/stats\//.test(p)) return 'stats';
          if (/\/scores\//.test(p)) return 'scores';
          if (/\/projections\//.test(p)) return 'proj';
          if (/\/league\//.test(p)) return 'league';
        } catch (e) {}
        return 'api';
      }
      function beginSl(rec) {
        rec.what = slWhat(rec.url);
        var n = 0;
        for (var id in inflight) { if (inflight[id].k === 'sl') n++; }
        rec.sl = n; // Sleeper requests in flight including this one (a normal poll = 2)
        if (n > S.slOverlapMax) S.slOverlapMax = n;
        slRecent.push(rec);
        if (slRecent.length > 12) slRecent.shift();
        return rec;
      }
      function slDone(rec, t0, t1, t2, chars, err) {
        var read = Math.round(t1 - t0), parse = Math.round(t2 - t1);
        rec.read = read; rec.parse = parse;
        S.slJson++; S.slParseSum += parse; S.slReadSum += read;
        if (parse > S.slParseMax) S.slParseMax = parse;
        if (read > S.slReadMax) S.slReadMax = read;
        if (parse > S.slParseWin) S.slParseWin = parse;
        if (read > S.slReadWin) S.slReadWin = read;
        mark('sleeper ' + rec.what + ' read ' + read + ' parse ' + parse + 'ms');
        var slow = (rec.hdr + read) > 1000 || parse > 100 || !!err;
        if (slow || ep) emit(slow ? 'warn' : 'log', 'sleeper ' + rec.what + ' hdr ' + rec.hdr + ' read ' + read + ' parse ' + parse + ' ms, ' + chars + ' chars, inflight@start ' + rec.sl + (err ? ' ' + err : ''));
      }
      function beginReq(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) ? input.url : String(input);
        var k = classify(url);
        if (!k) return null;
        var now = performance.now();
        var rec = { id: ++reqId, k: k, url: url, s: shortUrl(url), t: now, at: ts() };
        inflight[rec.id] = rec;
        if (k === 'sl') return beginSl(rec);
        recent.push(rec);
        if (recent.length > RECENT_MAX) recent.shift();
        if (k === 'seg') {
          S.segReq++;
          var prev = segSeen[url];
          if (prev) {
            prev.count++; S.dup++;
            emit('warn', 'DUP segment fetch #' + prev.count + ' (first ' + r1((now - prev.t) / 1000) + 's ago) ' + rec.s);
          } else {
            segSeen[url] = { t: now, count: 1 };
            segOrder.push(url);
            if (segOrder.length > 120) { var old = segOrder.shift(); delete segSeen[old]; delete segLen[old]; }
          }
        } else {
          if (lastPlAt !== null) {
            var gap = now - lastPlAt;
            if (gap > S.plGapMax) S.plGapMax = gap;
            if (gap > 6000) emit('warn', 'playlist poll gap ' + r1(gap / 1000) + ' s');
          }
          lastPlAt = now;
        }
        return rec;
      }
      function parsePlaylist(rec, txt) {
        var m = /#EXT-X-MEDIA-SEQUENCE:(\d+)/.exec(txt);
        var seq = m ? +m[1] : null;
        var n = (txt.match(/#EXTINF/g) || []).length;
        var td = /#EXT-X-TARGETDURATION:(\d+)/.exec(txt);
        var flags = (/#EXT-X-ENDLIST/.test(txt) ? 'ENDLIST ' : '') + (/#EXT-X-DISCONTINUITY/.test(txt) ? 'DISC ' : '');
        S.plReq++;
        lastPl = { seq: seq, n: n, td: td ? +td[1] : null };
        mark('playlist seq ' + seq + ' segs ' + n);
        var note = null;
        if (seq !== null && plPrevSeq !== null) {
          if (seq === plPrevSeq) { plSame++; if (plSame === 5) note = 'seq unchanged for 5 polls (origin/playlist stalled?)'; }
          else {
            plSame = 0;
            if (seq < plPrevSeq) note = 'seq went BACKWARDS from ' + plPrevSeq;
            else if (seq - plPrevSeq > n) note = 'seq JUMPED +' + (seq - plPrevSeq) + ' (> window ' + n + ', segments missed)';
          }
        }
        if (seq !== null) plPrevSeq = seq;
        if (note || flags || ep || plPrevSeq === seq && S.plReq === 1 || rec.hdr > 1000) {
          emit(note ? 'warn' : 'log', 'playlist seq ' + seq + ' segs ' + n + ' target ' + (td ? td[1] : '?') + ' ' + flags + 'hdr ' + rec.hdr + ' ms ' + (note || ''));
        }
      }
      function endReq(rec, resp) {

          S.slN++;
          if (rec.hdr > S.slHdrMax) S.slHdrMax = rec.hdr;
          if (len) S.slBytes += +len;
          try { resp.__dslRec = rec; } catch (e) {} // lets the json() shim below time this response's body read + parse
        }
        if (!resp.ok) { S.failed++; emit('warn', 'HTTP ' + resp.status + ' ' + rec.k + ' ' + rec.s + ' hdr ' + rec.hdr + ' ms'); }
        else if (rec.k === 'seg' && (ep || rec.hdr > 1500)) emit('log', 'seg ' + resp.status + ' hdr ' + rec.hdr + ' ms len ' + (rec.len || '?') + ' ' + rec.s);
        if (rec.k === 'pl' && resp.ok) {
          resp.clone().text().then(function (txt) { try { parsePlaylist(rec, txt); } catch (e) {} }, function () {});
        }
      }
      function failReq(rec, err) {

        var ms = Math.round(performance.now() - rec.t);
        rec.status = 'ERR'; rec.hdr = ms;
        if (err && err.name === 'AbortError') {
          S.aborted++;
          emit('warn', 'ABORTED ' + rec.k + ' after ' + ms + ' ms (caller-initiated abort: player timeout/retry or teardown) ' + rec.s);
        } else {
          S.failed++;
          emit('warn', 'FAILED ' + rec.k + ' after ' + ms + ' ms: ' + (err && (err.name + ': ' + err.message)) + ' ' + rec.s);
        }
      }
      var origFetch = window.fetch;
      if (typeof origFetch === 'function') {
        window.fetch = function (input, init) {

          try { rec = beginReq(input, init); } catch (e) { rec = null; }
          var p;
          try { p = origFetch.apply(this, arguments); }
          catch (e) { if (rec) delete inflight[rec.id]; throw e; }

            try { p.then(function (resp) { try { endReq(rec, resp); } catch (e) {} }, function (err) { try { failReq(rec, err); } catch (e) {} }); } catch (e) {}

      }

      // ---- S4.4f: MSE append timing + Shaka internals (the choke happens BETWEEN download and playback) ----
      function mimeShort(m) { return String(m || '').slice(0, 70); }
      function sigOf(data) {
        try {

        } catch (e) { return '?'; }
      }
      function trackSb(sb, mime) {
        var d = { id: ++M.sbs, mime: mime, type: String(mime || '').split(';')[0], pend: null, n: 0 };
        sb.__dm = d;
        sbList.push(sb);
        if (sbList.length > 8) sbList.shift();
        emit('log', 'MSE addSourceBuffer #' + d.id + ' ' + mimeShort(mime));
        sb.addEventListener('updateend', function () {
          try {
            var p = d.pend;
            if (!p) return;
            d.pend = null;
            var a = performance.now() - p.t0;
            M.done++; M.aSum += a;
            if (a > M.aMax) M.aMax = a;
            if (a > M.aWin) M.aWin = a;
            mark('append ' + d.type + ' ' + Math.round(a) + 'ms');
            var slow = a > 500 || p.sync > 50;
            if (slow || ep || d.n === 1) emit(slow ? 'warn' : 'log', 'append #' + d.id + ' ' + d.type + ' ' + p.bytes + ' B sig ' + p.sig + ' sync ' + Math.round(p.sync) + ' ms async ' + Math.round(a) + ' ms' + (slow || ep ? ' ' + J(snap()) : ''));
          } catch (e) {}
        });
        sb.addEventListener('error', function () { M.errs++; emit('error', 'MSE SourceBuffer #' + d.id + ' error event'); });
      }
      function mseState() {
        var now = performance.now(), o = { sbs: [], lastAppendAgoS: lastAppendAt ? r1((now - lastAppendAt) / 1000) : null };
        sbList.forEach(function (sb) {
          try {
            var d = sb.__dm || {}, b = sb.buffered, rg = [];
            for (var i = 0; i < b.length && i < 3; i++) rg.push(r1(b.start(i)) + '-' + r1(b.end(i)));

      }
      function mseSummary() {
        var now = performance.now(), upd = null;
        sbList.forEach(function (sb) {
          try { var d = sb.__dm; if (d && d.pend && sb.updating) { var ms = Math.round(now - d.pend.t0); if (upd === null || ms > upd) upd = ms; } } catch (e) {}

  const x = pregameParts(team, games);
  return (x.when + ' ' + x.opp).trim();
}

// ---------------------------------------------------------------------------
// S2.1 (2026-10-01): league scoring engine on CUMULATIVE stat rows (the /stats/nfl/game/<id> row's
// `stats{}`). Pure, node-testable. Rules (source: live-stats FantasyScoring.ps1 + wk2 probe):
//  (1) every NON-bracket scoring_settings key: stats[key] * scoring[key] (bonus counters, 40+ yd
//      thresholds, K keys, fum etc. all arrive as plain cumulative counts in the row);
//  (2) pts_allow_* / yds_allow_* are mutually-exclusive BRACKET flags: only the CURRENT band counts =
//      the highest-lower-bound band whose flag is > 0 in the row (covers rows that carry only the
//      current flag AND rows with sticky earlier flags); bands absent from scoring score 0 but still
//      win as the current band; a DEF row with no flag yet sits in its '0' band (baseline value).
//  (3) the baseline only applies to DEF (pos === 'DEF') -- never add it to non-DEF rows.
// ---------------------------------------------------------------------------
const BRACKET_RE = /^(pts_allow|yds_allow)_(\d+)(?:_\d+|p)?$/;
const BRACKET_FAMILY_NAMES = ['pts_allow', 'yds_allow'];
function bracketInfo(key) {
  const m = BRACKET_RE.exec(key);
  return m ? { family: m[1], lo: Number(m[2]) } : null;
}
function leagueScore(stats, scoring, pos) {
  if (!stats) return 0;
  const sc = scoring || {};
  let total = 0;
  Object.keys(sc).forEach(function(k) {
    if (typeof sc[k] !== 'number' || bracketInfo(k)) return;
    const v = stats[k];
    if (typeof v === 'number') total += v * sc[k];
  });
  const cur = {};
  Object.keys(stats).forEach(function(k) {
    const b = bracketInfo(k);
    if (!b || !(stats[k] > 0)) return;
    if (!cur[b.family] || b.lo > cur[b.family].lo) cur[b.family] = { lo: b.lo, key: k };
  });
  BRACKET_FAMILY_NAMES.forEach(function(f) {
    let key = cur[f] ? cur[f].key : null;
    if (!key && pos === 'DEF') {
      Object.keys(sc).forEach(function(k) { const b = bracketInfo(k); if (b && b.family === f && b.lo === 0) key = k; });
    }
    if (key && typeof sc[key] === 'number') total += sc[key];
  });
  return total;
}

// ---------------------------------------------------------------------------
// S2.2 (2026-10-01): per-game stats polling. Pure planner + injectable one-tick runner (node-testable
// with fake deps/clock), then the DOM paint + timer loop. Policy (user, 2026-10-01): a game that has
// not started is NEVER polled -- gated on wall clock vs its scheduled start (/scores date_time), no
// early checks; once now >= start (or /scores says in progress) stats are polled every STATS_POLL_MS;
// /scores is re-read every SCORES_REFRESH_MS ONLY while some game is being polled, to learn
// is_over/is_in_progress; an is_over game gets ONE final stats fetch, then stops.
// ---------------------------------------------------------------------------
const STATS_POLL_MS = 15000;
const SCORES_REFRESH_MS = 60000;
const MAX_SLEEP_MS = 60000;

// phase: 'WAIT' (before scheduled start), 'POLL' (started / in progress), 'FINAL' (over, final stats not
// fetched yet), 'DONE' (over + final stats fetched). Missing/invalid start time => POLL (never stall).
function gamePhase(g, nowMs, finalFetched) {
  if (g.isOver) return (finalFetched && finalFetched[g.gameKey]) ? 'DONE' : 'FINAL';
  const start = Date.parse(g.dateTime);
  if (g.inProgress || isNaN(start) || nowMs >= start) return 'POLL';
  return 'WAIT';
}

// Only the games the picked matchup's players are in (fetchGames returns all 32 teams).
function gameByKey(games, gameKey) {
  const ks = Object.keys(games || {});
  for (let i = 0; i < ks.length; i++) { if (games[ks[i]] && games[ks[i]].gameKey === gameKey) return games[ks[i]]; }
  return null;
}
function relevantGames(cfg, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.team || !games || !games[p.team]) return;
      out[p.team] = games[p.team];
    });
  });
  return out;
}

function idsForGame(cfg, games, gameKey) {
  const ids = [];
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId || !p.team) return;
      const g = games ? games[p.team] : null;
      if (g && g.gameKey === gameKey) ids.push(p.playerId);
    });
  });
  return ids;
}

// games = team -> game info map (already filtered to relevant teams). Returns what to do NOW.
function planPolls(games, finalFetched, nowMs, lastScoresMs) {
  const seen = {};
  const pollKeys = [], finalKeys = [];
  let anyPoll = false, anyWait = false, minWait = Infinity;
  Object.keys(games || {}).forEach(function(team) {
    const g = games[team];
    if (!g || !g.gameKey || seen[g.gameKey]) return;
    seen[g.gameKey] = true;
    const ph = gamePhase(g, nowMs, finalFetched);
    if (ph === 'POLL') { pollKeys.push(g.gameKey); anyPoll = true; }
    else if (ph === 'FINAL') { pollKeys.push(g.gameKey); finalKeys.push(g.gameKey); }
    else if (ph === 'WAIT') { anyWait = true; minWait = Math.min(minWait, Date.parse(g.dateTime) - nowMs); }
  });
  const refreshScores = anyPoll && (nowMs - (lastScoresMs || 0) >= SCORES_REFRESH_MS);
  let nextWakeMs = null;
  if (pollKeys.length) nextWakeMs = STATS_POLL_MS;
  else if (anyWait) nextWakeMs = Math.max(1000, minWait);
  return { pollKeys: pollKeys, finalKeys: finalKeys, refreshScores: refreshScores, nextWakeMs: nextWakeMs, done: nextWakeMs === null };
}

// One game's cumulative stats, reduced to just the picked players: playerId -> stats{}.
async function fetchGameStats(season, gameKey, ids) {
  const rows = await getJson(API + '/stats/nfl/game/' + encodeURIComponent(gameKey) + '?season_type=' + SEASON_TYPE + '&season=' + season);
  const want = {};
  (ids || []).forEach(function(id) { want[String(id)] = true; });
  const out = {};
  (Array.isArray(rows) ? rows : []).forEach(function(r) {
    const id = String(r.player_id);
    if (want[id]) out[id] = r.stats || {};
  });
  return out;
}

// playerId -> league points. A player whose game has not been fetched yet is omitted (card stays
// blank); fetched game + no row => 0 for non-DEF, null (blank) for DEF.
function computeCardPoints(cfg, statsByGame, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId) return;
      const g = games ? games[p.team] : null;
      const rows = (g && g.gameKey) ? statsByGame[g.gameKey] : null;
      if (!rows) return;
      const st = rows[p.playerId];
      out[p.playerId] = st ? leagueScore(st, cfg.scoring, p.pos) : (p.pos === 'DEF' ? null : 0);
    });
  });
  return out;
}

// ---------------------------------------------------------------------------
// S3.1 (2026-10-01): per-game live state from the genius plays feed. deriveCurrentState + its two
// label helpers are copied VERBATIM from receiver.html (the authoritative live copy; itself a port
// of debug-cards). plays = newest-first array. cardView is the pure per-card perspective rules.
// ---------------------------------------------------------------------------
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
// Batch 3 (2026-10-04): extra-point / two-point plays have no label of their own any more -- deriveCurrentState treats them as an End Zone state for the kicking team (the other card shows '<TEAM> on Defense' via the normal possession rule).
function isXpPlay(m) {
  return m.play_type === 'extra_point' || m.play_type === 'two_point_conversion' || m.play_type === 'two_point_attempt';
}
function specialLabelForPlay(m) {
  if (m.play_type === 'kickoff' || m.play_type === 'kickoff_touchback' || m.play_type === 'kickoff_muffed') {
    return (m.team || m.possession) + ' Kickoff';
  }
  if (m.play_type === 'field_goal' && /is GOOD/i.test(m.description || '')) {
    return (m.team || m.possession) + ' Kickoff';
  }
  return null;
}
function terminalPhaseLabelForPlay(m) {
  if (m.play_type === 'game_over') return 'Final';
  if (m.play_type === 'period_end' && m.quarter_name === '2') return 'Halftime';
  return null;
}
// Batch 3: team that actually scored on the newest scoring play = the side whose points rose vs the nearest older play that carries points (play-record points are post-play, verified on HOU@DAL 2026-10-04). Needs the game's {home, away} abbrs; null when unresolvable (caller falls back to the possession field, which on a return TD is the team that had the ball at the snap).
function scorerTeam(plays, newest, g) {
  if (!g || !g.home || !g.away) return null;
  const nm = newest.metadata || {};
  for (let j = plays.indexOf(newest) + 1; j < plays.length; j++) {
    const o = plays[j].metadata;
    if (!o || o.away_points == null || o.home_points == null) continue;
    const dA = Number(nm.away_points) - Number(o.away_points);
    const dH = Number(nm.home_points) - Number(o.home_points);
    if (dA > 0 && !(dH > 0)) return g.away;
    if (dH > 0 && !(dA > 0)) return g.home;
    return null;
  }
  return null;
}
function deriveCurrentState(plays, g) {
  // Timeouts (TV/team) carry no down, possession or label; judge the state by the last non-timeout play so
  // e.g. the Extra Point / End Zone label holds through the break instead of reverting to the TD snap's down.
  const newest = plays.find(p => !(p.metadata && p.metadata.play_type === 'timeout')) || plays[0];
  const nm = newest.metadata || {};

  const term = terminalPhaseLabelForPlay(nm);
  if (term === 'Final') {
    return { clockStr: '', gamestate: 'FINAL', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
  }
  if (term === 'Halftime') {
    return { clockStr: 'Halftime', gamestate: 'HALFTIME', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
  }

  let statePlay = plays.find(p => p.metadata && p.metadata.down) || newest;
  const m = statePlay.metadata || {};
  const clockStr = (m.quarter_name != null && m.time_remaining_minutes != null)
    ? `Q${m.quarter_name} ${m.time_remaining_minutes}:${String(m.time_remaining_seconds).padStart(2, '0')}`
    : '--';

  const awayPts = nm.away_points;
  const homePts = nm.home_points;

  const label = specialLabelForPlay(nm);
  if (label) {
    return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.possession, specialLabel: label, specialTeam: nm.team || nm.possession, endZone: false, down: null, distance: null };
  }
  if (isXpPlay(nm)) {
    // PAT / two-point try: stays an End Zone state for the kicking team (record possession == team == kicking team, verified).
    return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.team || nm.possession, specialLabel: null, endZone: true, down: null, distance: null };
  }
  if (nm.is_scoring_play) {
    return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: scorerTeam(plays, newest, g) || nm.possession, specialLabel: null, endZone: true, down: null, distance: null };
  }

  const statePlayIdx = plays.indexOf(statePlay);
  let situationSourceMeta = m;
  for (let i = statePlayIdx - 1; i >= 0; i--) {
    const cand = plays[i].metadata;
    if (cand && cand.down) { situationSourceMeta = cand; break; }
  }
  return {
    clockStr, gamestate: 'LIVE', awayPts, homePts,
    possession: situationSourceMeta.possession || m.possession,
    specialLabel: null, endZone: false,
    down: situationSourceMeta.down, distance: situationSourceMeta.distance,
    fieldTeam: situationSourceMeta.yard_line_territory, fieldYards: situationSourceMeta.yard_line
  };
}

// Newest-first plays for one game (genius provider, same URL the receiver polls).
async function fetchGamePlays(season, gameKey) {
  const data = await getJson(API + '/plays/nfl/' + SEASON_TYPE + '/' + season + '/game/' + encodeURIComponent(gameKey) + '?limit=25&provider=genius');
  return (data && data.plays) || [];
}

// S3.2: field-dot position along the card's divider line, 0-100 = progress from the card team's OWN goal
// line (0) to the opponent's (100); null = dot hidden. Same rules as debug-cards updateFieldDot: only while
// LIVE (halftime/final carry no possession), no special label (kickoff/extra point), and only on the card of
// the team with the ball; End Zone => 100; else fieldYards (0-50 from fieldTeam's own goal line) flipped to
// the card team's frame.
function fieldDotPct(p, st) {
  if (!st || !p || !p.team) return null;
  if (st.gamestate !== 'LIVE' || st.specialLabel) return null;
  if (st.possession !== p.team) return null;
  let pct = null;
  if (st.endZone) pct = 100;
  else if (st.fieldTeam && st.fieldYards != null && isFinite(Number(st.fieldYards))) {
    pct = (st.fieldTeam === p.team) ? Number(st.fieldYards) : 100 - Number(st.fieldYards);
  }

}

function dotLeftPct(side, pct) { return side === 'own' ? pct : 100 - pct; }

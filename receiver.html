<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>stream-overlay receiver</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; }
  cast-media-player { width: 100%; height: 100%; }

  .player-cards {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: flex-end;
    gap: calc(20 / 1920 * 100vw);
    padding-left: calc(20 / 1920 * 100vw);
    z-index: 10;
  }
  .player-card {
    width: calc(200 / 1920 * 100vw);
    background: rgba(0,0,0,0.85);
    border-radius: 0 calc(40 / 1920 * 100vw) 0 0;
    padding: calc(12 / 1920 * 100vw) calc(16 / 1920 * 100vw);
    color: #fff;
    font-size: calc(16 / 1920 * 100vw);
    box-sizing: border-box;
  }
  .player-card .pc-name {
    color: #f0b429;
    font-size: calc(19 / 1920 * 100vw);
    font-weight: 700;
    margin-bottom: calc(4 / 1920 * 100vw);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-game-state {
    font-size: calc(13 / 1920 * 100vw);
    color: #ccc;
    margin-bottom: calc(8 / 1920 * 100vw);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  .player-card .pc-situation {
    font-size: calc(13 / 1920 * 100vw);
    color: #aaa;
    margin-bottom: calc(10 / 1920 * 100vw);
  }
  .player-card .pc-stats {
    font-size: calc(15 / 1920 * 100vw);
    font-weight: 600;
    color: #fff;
    border-top: 1px solid #333;
    padding-top: calc(8 / 1920 * 100vw);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-ticker {
    margin-top: calc(8 / 1920 * 100vw);
    min-height: calc(20 / 1920 * 100vw);
    font-size: calc(14 / 1920 * 100vw);
    font-weight: 700;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-card .pc-ticker.visible {
    opacity: 1;
  }
  /* ---- S4.1 matchup mode: region between the BEGIN/END markers is generated from matchup.html ---- */
  /* BEGIN SHARED CSS */
:root { --screen-vw: 1vw; }
  #lane-matchup {
    --mk: 1.8;
    --pad-y: 5;
    --pad-x: 7;
    --gap: 5;
    --stats-pad: 3;
    --u: calc(var(--mk) / 1920 * (100 * var(--screen-vw)));
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
    box-sizing: border-box;
    padding-top: calc(var(--gap) * var(--u));
  }
  #lane-matchup .matchup-side {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) * var(--u));
    flex: 0 0 auto;
    width: calc(110 * var(--u));
  }
  #lane-matchup .player-card {
    flex: 0 0 auto;
    width: 100%;
    background: rgba(0,0,0,0.72);
    border-radius: calc(6 * var(--u));
    padding: calc(var(--pad-y) * var(--u)) calc(var(--pad-x) * var(--u));
    color: #fff;
    font-size: calc(9.68 * var(--u));
    box-sizing: border-box;
    position: relative;
  }
  #lane-matchup .player-card .pc-name {
    color: #fff;
    font-size: calc(11.495 * var(--u));
    font-weight: 700;
    margin-bottom: calc(2.42 * var(--u));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: baseline;
    gap: calc(4 * var(--u));
  }
  #lane-matchup .player-card .pc-name .pc-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #lane-matchup .player-card .pc-name .pc-actual-pts { flex: 0 0 auto; }
  #lane-matchup .player-card .pc-game-state {
    font-size: calc(7.865 * var(--u));
    color: #ccc;
    margin-bottom: calc(4.84 * var(--u));
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  #lane-matchup .player-card .pc-game-state .pc-proj-pts { flex: 0 0 auto; }
  #lane-matchup .player-card .pc-situation {
    font-size: calc(7.865 * var(--u));
    color: #aaa;
    margin-bottom: calc(6.05 * var(--u));
  }
  #lane-matchup .player-card .pc-stats {
    font-size: calc(7.865 * var(--u));
    font-weight: 400;
    color: #aaa;
    border-top: 1px solid #333;
    padding-top: calc(var(--stats-pad) * var(--u));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 1em;
  }
  /* S3.2 field-position dot (ported from debug-cards): .pc-field is a zero-height wrapper right above
     .pc-stats (whose border-top IS the field line); the dot sits on its top edge so .pc-stats'
     overflow:hidden can't clip it. left% is set in JS. */
  #lane-matchup .player-card .pc-field { position: relative; height: 0; width: 100%; }
  #lane-matchup .player-card .pc-field-dot {
    position: absolute;
    top: 0.5px;
    left: 0;
    width: calc(5 * var(--u));
    height: calc(5 * var(--u));
    border-radius: 50%;
    background: #4ade80;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: left 0.3s ease, opacity 0.2s ease;
    pointer-events: none;
  }
  #lane-matchup .player-card .pc-field-dot.visible { opacity: 1; }
  #lane-matchup .player-card .pc-field-dot.no-anim { transition: none; }
  /* S3.3 ticker (ported from debug-cards): signed fantasy-points delta, OUTSIDE the card on the name/points
     line (right of own-column cards, left of opp-column cards), dark bg so the green text stays readable. */
  #lane-matchup .player-card .pc-ticker {
    position: absolute;
    left: 100%;
    top: calc((var(--pad-y) - 2) * var(--u));
    margin-left: calc(4 * var(--u));
    padding: calc(2 * var(--u)) calc(4 * var(--u));
    background: rgba(0,0,0,0.85);
    border-radius: calc(3 * var(--u));
    font-size: calc(11.495 * var(--u));
    font-weight: 700;
    color: #4ade80;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    pointer-events: none;
  }
  #lane-matchup .matchup-side.opp .player-card .pc-ticker { left: auto; right: 100%; margin-left: 0; margin-right: calc(4 * var(--u)); }
  #lane-matchup .player-card .pc-ticker.visible { opacity: 1; }
  /* END SHARED CSS */
  /* receiver-only: hidden unless body.matchup-mode; sits above the video like .player-cards; resets the old
     top-level .pc-ticker props (margin-top/min-height/overflow) that the shared ticker rule does not override */
  #lane-matchup { display: none; z-index: 10; pointer-events: none; }
  body.matchup-mode #lane-matchup { display: flex; }
  body.matchup-mode #player-cards { display: none; }
  #lane-matchup .player-card .pc-ticker { margin-top: 0; min-height: 0; overflow: visible; text-overflow: clip; }
</style>
</head>
<body>
  <div class="stage">
    <cast-media-player></cast-media-player>

    <div class="player-cards" id="player-cards"></div>

    <!-- S4.1 matchup mode screen (hidden unless body.matchup-mode) -->
    <div id="lane-matchup">
      <div id="matchup-own" class="matchup-side own"></div>
      <div id="matchup-opp" class="matchup-side opp"></div>
    </div>
  </div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
  // ---- S4.1 MATCHUP MODE (2026-10-01): 18-card live matchup screen, additive to the 3-card mode below. ----
  // Own <script> + IIFE so none of its names collide with the 3-card script (e.g. a DIFFERENT formatStatLine).
  // Activated by a CONFIG with mode:'matchup'; any other CONFIG takes the original path unchanged.
  window.KICKOFF_TZ = 'America/New_York'; // pregame kickoff times fixed to ET like the 3-card mode
  window.MatchupMode = (function() {
  // ==== BEGIN SHARED JS (generated from matchup.html -- byte-identical region, do not hand-edit) ====
const API = 'https://api.sleeper.app';
const SEASON_TYPE = 'regular';
const NON_STARTER_SLOTS = ['BN', 'IR', 'TAXI'];

async function getJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(url + ' -> HTTP ' + res.status);
  return res.json();
}

function loadLeague(leagueId) {
  return getJson(API + '/v1/league/' + encodeURIComponent(leagueId));
}

// Teams for the picker: roster_id + display name (team_name, else owner display_name).
async function loadTeams(leagueId) {
  const [users, rosters] = await Promise.all([
    getJson(API + '/v1/league/' + encodeURIComponent(leagueId) + '/users'),
    getJson(API + '/v1/league/' + encodeURIComponent(leagueId) + '/rosters')
  ]);
  const byOwner = {};
  users.forEach(function(u) { byOwner[u.user_id] = u; });
  return rosters.map(function(r) {
    const u = byOwner[r.owner_id] || {};
    const teamName = (u.metadata && u.metadata.team_name) || u.display_name || ('Team ' + r.roster_id);
    return { rosterId: r.roster_id, ownerId: r.owner_id, name: teamName, owner: u.display_name || '' };
  }).sort(function(a, b) { return a.rosterId - b.rosterId; });
}

// Starting slots in lineup order (matchups[].starters aligns index-for-index with these).
function startingSlots(rosterPositions) {
  return (rosterPositions || []).filter(function(p) { return NON_STARTER_SLOTS.indexOf(p) === -1; });
}

// Week-wide projections (one call). Doubles as the name/position/team lookup: each row carries an
// embedded `player` object, so no heavy /v1/players/nfl pull is needed. Returns Map(playerId -> row).
async function loadWeekProjections(season, week) {
  const rows = await getJson(API + '/projections/nfl/' + season + '/' + week + '?season_type=' + SEASON_TYPE);
  const map = {};
  rows.forEach(function(r) { map[String(r.player_id)] = r; });
  return map;
}

// Resolve the picked team's matchup: both sides' week-specific starters mapped onto slots.
// Opponent = other roster sharing matchup_id; null matchup_id / no partner => opp = null (own side only).
async function resolveMatchup(leagueId, week, rosterId, projMap) {
  const [league, teams, matchups] = await Promise.all([
    loadLeague(leagueId),
    loadTeams(leagueId),
    getJson(API + '/v1/league/' + encodeURIComponent(leagueId) + '/matchups/' + week)
  ]);
  const slots = startingSlots(league.roster_positions);
  const ownM = matchups.find(function(m) { return Number(m.roster_id) === Number(rosterId); });
  if (!ownM) throw new Error('roster ' + rosterId + ' not found in week ' + week + ' matchups');
  const oppM = (ownM.matchup_id == null) ? null : (matchups.find(function(m) {
    return m.matchup_id === ownM.matchup_id && Number(m.roster_id) !== Number(rosterId);
  }) || null);
  const teamById = {};
  teams.forEach(function(t) { teamById[t.rosterId] = t; });

  function buildSide(side, m) {
    const players = [];
    const starters = m.starters || [];
    starters.forEach(function(pid, i) {
      const id = String(pid);
      if (!id || id === '0') { players.push({ side: side, slot: slots[i] || '?', playerId: null, empty: true }); return; }
      const row = projMap ? projMap[id] : null;
      const p = (row && row.player) || {};
      const isDef = (slots[i] === 'DEF') || !/^\d+$/.test(id);
      players.push({
        side: side,
        slot: slots[i] || '?',
        playerId: id,
        name: isDef ? ((p.first_name ? (p.first_name + ' ' + (p.last_name || '')).trim() : id)) : (((p.first_name || '') + ' ' + (p.last_name || '')).trim() || id),
        pos: isDef ? 'DEF' : ((p.position) || (p.fantasy_positions && p.fantasy_positions[0]) || '?'),
        team: isDef ? id : (p.team || null),
        projStats: row ? row.stats : null
      });
    });
    return { side: side, rosterId: m.roster_id, team: teamById[m.roster_id] || null, players: players };
  }

  return {
    leagueId: String(leagueId),
    leagueName: league.name,
    season: league.season,
    seasonType: SEASON_TYPE,
    week: Number(week),
    slots: slots,
    scoring: league.scoring_settings,
    own: buildSide('own', ownM),
    opp: oppM ? buildSide('opp', oppM) : null
  };
}

// ---------------------------------------------------------------------------
// S1.2 (2026-10-01): static cards. Pure helpers first (node-testable), DOM render after.
// ---------------------------------------------------------------------------

// 2 decimals (matches debug-cards fmtPts), plus a tiny epsilon so float-sum artifacts at an exact
// half (9.524999999999999 for a true 9.525) round half-up like the stored data does.
function fmtPts(n) {
  return (Math.round((n + (n >= 0 ? 1e-9 : -1e-9)) * 100) / 100).toFixed(2);
}

// Matchup-bar name line (same rule as debug-cards formatMatchupName): `F. Last` for players,
// DEF = last word of the team name only. Known limit (same as debug): a multi-token last name
// renders as initial + the rest ('A. St. Brown'); a one-token name renders 'X. '.
function formatMatchupName(p) {
  const parts = String(p.name || '').trim().split(/\s+/);
  if (p.slot === 'DEF' || p.pos === 'DEF') return parts[parts.length - 1];
  const first = parts.shift() || '';
  return first.charAt(0) + '. ' + parts.join(' ');
}

// League-scored projection: plain dot product of the projection row's stats over the league's
// scoring_settings keys. (DEF rows already carry their bracket flags, so no bracket parsing.)
function leagueComputedProj(stats, scoring) {
  let total = 0;
  Object.keys(scoring || {}).forEach(function(k) {
    const v = stats ? stats[k] : undefined;
    if (typeof v === 'number' && typeof scoring[k] === 'number') total += v * scoring[k];
  });
  return total;
}

// Kickoff text `Ddd h:mm AM/PM` in the viewer's local timezone (debug-cards hard-coded 'Mon 8:15 PM').
function kickoffText(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return '';
  // S4.1: optional fixed timezone (the Chromecast receiver sets window.KICKOFF_TZ = 'America/New_York');
  // unset => viewer-local exactly as before.
  const tz = (typeof window !== 'undefined' && window.KICKOFF_TZ) || undefined;
  return d.toLocaleDateString('en-US', { weekday: 'short', timeZone: tz }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz });
}

// Week schedule from /scores: map team abbr -> { away, home, dateTime, isOver, inProgress }.
async function fetchGames(season, week) {
  const raw = await getJson(API + '/scores/nfl/' + SEASON_TYPE + '/' + season + '/' + week);
  const rows = Array.isArray(raw) ? raw : (raw && raw.games) || [];
  const byTeam = {};
  rows.forEach(function(g) {
    const m = g.metadata || {};
    if (!m.away_team || !m.home_team) return;
    const info = { gameKey: m.game_key || null, away: m.away_team, home: m.home_team, dateTime: m.date_time || g.date || null, isOver: !!m.is_over, inProgress: !!m.is_in_progress };
    byTeam[m.away_team] = info;
    byTeam[m.home_team] = info;
  });
  return byTeam;
}

// Pregame score-slot text: `<kickoff> VS|@ <opp>` (VS = this team is the home team); BYE if no game.
function pregameText(team, games) {
  if (!team) return '';
  const g = games ? games[team] : null;
  if (!g) return 'BYE';
  const isHome = g.home === team;
  return (kickoffText(g.dateTime) + ' ' + (isHome ? 'VS' : '@') + ' ' + (isHome ? g.away : g.home)).trim();
}

// ---------------------------------------------------------------------------
// S2.1 (2026-10-01): league scoring engine on CUMULATIVE stat rows (the /stats/nfl/game/<id> row's
// `stats{}`). Pure, node-testable. Rules (source: live-stats FantasyScoring.ps1 + wk2 probe):
//  (1) every NON-bracket scoring_settings key: stats[key] * scoring[key] (bonus counters, 40+ yd
//      thresholds, K keys, fum etc. all arrive as plain cumulative counts in the row);
//  (2) pts_allow_* / yds_allow_* are mutually-exclusive BRACKET flags: only the CURRENT band counts =
//      the highest-lower-bound band whose flag is > 0 in the row (covers rows that carry only the
//      current flag AND rows with sticky earlier flags); bands absent from scoring score 0 but still
//      win as the current band; a DEF row with no flag yet sits in its '0' band (baseline value).
//  (3) the baseline only applies to DEF (pos === 'DEF') -- never add it to non-DEF rows.
// ---------------------------------------------------------------------------
const BRACKET_RE = /^(pts_allow|yds_allow)_(\d+)(?:_\d+|p)?$/;
const BRACKET_FAMILY_NAMES = ['pts_allow', 'yds_allow'];
function bracketInfo(key) {
  const m = BRACKET_RE.exec(key);
  return m ? { family: m[1], lo: Number(m[2]) } : null;
}
function leagueScore(stats, scoring, pos) {
  if (!stats) return 0;
  const sc = scoring || {};
  let total = 0;
  Object.keys(sc).forEach(function(k) {
    if (typeof sc[k] !== 'number' || bracketInfo(k)) return;
    const v = stats[k];
    if (typeof v === 'number') total += v * sc[k];
  });
  const cur = {};
  Object.keys(stats).forEach(function(k) {
    const b = bracketInfo(k);
    if (!b || !(stats[k] > 0)) return;
    if (!cur[b.family] || b.lo > cur[b.family].lo) cur[b.family] = { lo: b.lo, key: k };
  });
  BRACKET_FAMILY_NAMES.forEach(function(f) {
    let key = cur[f] ? cur[f].key : null;
    if (!key && pos === 'DEF') {
      Object.keys(sc).forEach(function(k) { const b = bracketInfo(k); if (b && b.family === f && b.lo === 0) key = k; });
    }
    if (key && typeof sc[key] === 'number') total += sc[key];
  });
  return total;
}

// ---------------------------------------------------------------------------
// S2.2 (2026-10-01): per-game stats polling. Pure planner + injectable one-tick runner (node-testable
// with fake deps/clock), then the DOM paint + timer loop. Policy (user, 2026-10-01): a game that has
// not started is NEVER polled -- gated on wall clock vs its scheduled start (/scores date_time), no
// early checks; once now >= start (or /scores says in progress) stats are polled every STATS_POLL_MS;
// /scores is re-read every SCORES_REFRESH_MS ONLY while some game is being polled, to learn
// is_over/is_in_progress; an is_over game gets ONE final stats fetch, then stops.
// ---------------------------------------------------------------------------
const STATS_POLL_MS = 15000;
const SCORES_REFRESH_MS = 60000;
const MAX_SLEEP_MS = 60000;

// phase: 'WAIT' (before scheduled start), 'POLL' (started / in progress), 'FINAL' (over, final stats not
// fetched yet), 'DONE' (over + final stats fetched). Missing/invalid start time => POLL (never stall).
function gamePhase(g, nowMs, finalFetched) {
  if (g.isOver) return (finalFetched && finalFetched[g.gameKey]) ? 'DONE' : 'FINAL';
  const start = Date.parse(g.dateTime);
  if (g.inProgress || isNaN(start) || nowMs >= start) return 'POLL';
  return 'WAIT';
}

// Only the games the picked matchup's players are in (fetchGames returns all 32 teams).
function relevantGames(cfg, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.team || !games || !games[p.team]) return;
      out[p.team] = games[p.team];
    });
  });
  return out;
}

function idsForGame(cfg, games, gameKey) {
  const ids = [];
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId || !p.team) return;
      const g = games ? games[p.team] : null;
      if (g && g.gameKey === gameKey) ids.push(p.playerId);
    });
  });
  return ids;
}

// games = team -> game info map (already filtered to relevant teams). Returns what to do NOW.
function planPolls(games, finalFetched, nowMs, lastScoresMs) {
  const seen = {};
  const pollKeys = [], finalKeys = [];
  let anyPoll = false, anyWait = false, minWait = Infinity;
  Object.keys(games || {}).forEach(function(team) {
    const g = games[team];
    if (!g || !g.gameKey || seen[g.gameKey]) return;
    seen[g.gameKey] = true;
    const ph = gamePhase(g, nowMs, finalFetched);
    if (ph === 'POLL') { pollKeys.push(g.gameKey); anyPoll = true; }
    else if (ph === 'FINAL') { pollKeys.push(g.gameKey); finalKeys.push(g.gameKey); }
    else if (ph === 'WAIT') { anyWait = true; minWait = Math.min(minWait, Date.parse(g.dateTime) - nowMs); }
  });
  const refreshScores = anyPoll && (nowMs - (lastScoresMs || 0) >= SCORES_REFRESH_MS);
  let nextWakeMs = null;
  if (pollKeys.length) nextWakeMs = STATS_POLL_MS;
  else if (anyWait) nextWakeMs = Math.max(1000, minWait);
  return { pollKeys: pollKeys, finalKeys: finalKeys, refreshScores: refreshScores, nextWakeMs: nextWakeMs, done: nextWakeMs === null };
}

// One game's cumulative stats, reduced to just the picked players: playerId -> stats{}.
async function fetchGameStats(season, gameKey, ids) {
  const rows = await getJson(API + '/stats/nfl/game/' + encodeURIComponent(gameKey) + '?season_type=' + SEASON_TYPE + '&season=' + season);
  const want = {};
  (ids || []).forEach(function(id) { want[String(id)] = true; });
  const out = {};
  (Array.isArray(rows) ? rows : []).forEach(function(r) {
    const id = String(r.player_id);
    if (want[id]) out[id] = r.stats || {};
  });
  return out;
}

// playerId -> league points. A player whose game has not been fetched yet is omitted (card stays
// blank); fetched game + no row => 0 for non-DEF, null (blank) for DEF.
function computeCardPoints(cfg, statsByGame, games) {
  const out = {};
  [cfg.own, cfg.opp].forEach(function(side) {
    if (!side) return;
    side.players.forEach(function(p) {
      if (p.empty || !p.playerId) return;
      const g = games ? games[p.team] : null;
      const rows = (g && g.gameKey) ? statsByGame[g.gameKey] : null;
      if (!rows) return;
      const st = rows[p.playerId];
      out[p.playerId] = st ? leagueScore(st, cfg.scoring, p.pos) : (p.pos === 'DEF' ? null : 0);
    });
  });
  return out;
}

// ---------------------------------------------------------------------------
// S3.1 (2026-10-01): per-game live state from the genius plays feed. deriveCurrentState + its two
// label helpers are copied VERBATIM from receiver.html (the authoritative live copy; itself a port
// of debug-cards). plays = newest-first array. cardView is the pure per-card perspective rules.
// ---------------------------------------------------------------------------
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function specialLabelForPlay(m) {

    if (stats.pass_td) parts.push(`${stats.pass_td} TD`);
    if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
    if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // ---- Live player-stat cards (Sleeper-sourced, no backend/proxy needed) ----
    // Multi-card port (2026-09-21) of public/index.html's 3-card logic. Sleeper's endpoints are
    // public/unauthenticated, so the receiver -- an embedded browser on the Chromecast itself --
    // can fetch them directly, same as the sender does. ONE fetch pair per poll is shared by all
    // cards: game state (clock/score/possession/down-distance) is game-wide, only the stat row
    // and ticker are per-player.
    // Test-config DEFAULTS. `let` (not const) because the sender can replace them at runtime with
    // a CONFIG message (R1), so one hosted receiver serves any game/lineup instead of needing an
    // edit + redeploy per game. A receiver that never gets a CONFIG shows these defaults.
    // Default lineup: NYG @ LAR, Week 2 MNF 2026, game_id 202610232 -- Cam Skattebo (RB),
    // Isaiah Likely (TE), Matthew Stafford (QB).
    let PC_GAME_ID = '202610232';
    const PC_SEASON = 2026;
    const PC_SEASON_TYPE = 'regular';
    let PC_AWAY_TEAM = 'NYG';
    let PC_HOME_TEAM = 'LAR';
    // 2026-09-23 port: PC_WEEK is user-set on the sender's orchestrator page and arrives via CONFIG
    // (null until set -- a null week is LEGAL, it only means the pregame /scores lookup is skipped).
    // `team` per player (real roster team, independent of home/away) drives own-score-first
    // ordering + possession-vs-card comparison, kept in lockstep with index.html PC_CONFIG.
    let PC_WEEK = null;
    let PC_PLAYERS = [
      { playerId: '12481', playerName: 'Cam Skattebo', position: 'RB', team: 'NYG' },
      { playerId: '8131', playerName: 'Isaiah Likely', position: 'TE', team: 'NYG' },
      { playerId: '421', playerName: 'Matthew Stafford', position: 'QB', team: 'LAR' }
    ];
    const PC_POLL_MS = 3000;
    const PC_TICKER_DISPLAY_MS = 10000;

    // Bumped on every accepted CONFIG. An in-flight poll captures the value at its start and
    // discards its result if this changed while it was awaiting the network -- otherwise a poll
    // begun under the OLD lineup could paint stale data over the NEW lineup's cards.
    let pcConfigEpoch = 0;
    let pcHasConfig = false; // true once a valid CONFIG has been applied (reported in STATE_SYNC)

    // Custom message channel shared with the sender (index.html CAST_NAMESPACE).
    const CAST_NAMESPACE = 'urn:x-cast:com.streamoverlay.status';

    // ---- Card container: rebuilt from PC_PLAYERS whenever the lineup/game changes. ----
    // pcCards[playerId] holds the element refs + PER-PLAYER ticker state, so one player's play
    // can never suppress or trigger another player's ticker.
    const playerCardsEl = document.getElementById('player-cards');
    let pcCards = {};

    function buildCards() {
      // Clear any pending ticker timers from the old cards before discarding them.
      Object.keys(pcCards).forEach(function(id) {
        if (pcCards[id].tickerHideTimer) clearTimeout(pcCards[id].tickerHideTimer);
      });
      playerCardsEl.innerHTML = '';
      pcCards = {};
      PC_PLAYERS.forEach(function(p) {
        const card = document.createElement('div');
        card.className = 'player-card';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'pc-name';
        nameDiv.textContent = p.playerName;
        const stateDiv = document.createElement('div');
        stateDiv.className = 'pc-game-state';
        const clockSpan = document.createElement('span');
        clockSpan.className = 'pc-clock';
        clockSpan.textContent = '--';
        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'pc-score';
        scoreSpan.textContent = '--';
        const possSpan = document.createElement('span');
        possSpan.className = 'pc-poss';
        possSpan.textContent = '--';
        stateDiv.appendChild(clockSpan);
        stateDiv.appendChild(scoreSpan);
        stateDiv.appendChild(possSpan);
        const sitDiv = document.createElement('div');
        sitDiv.className = 'pc-situation';
        sitDiv.textContent = '--';
        const statsDiv = document.createElement('div');
        statsDiv.className = 'pc-stats';
        statsDiv.textContent = '--';
        const tickerDiv = document.createElement('div');
        tickerDiv.className = 'pc-ticker';
        card.appendChild(nameDiv);
        card.appendChild(stateDiv);
        card.appendChild(sitDiv);
        card.appendChild(statsDiv);
        card.appendChild(tickerDiv);
        playerCardsEl.appendChild(card);
        pcCards[p.playerId] = {
          playerName: p.playerName,
          position: p.position,
          team: p.team,
          clockEl: clockSpan,
          scoreEl: scoreSpan,
          possEl: possSpan,
          sitEl: sitDiv,
          statsEl: statsDiv,
          tickerEl: tickerDiv,
          tickerHideTimer: null,
          lastTickerSequence: null,
          baselineSeeded: false
        };
      });
    }
    buildCards();

    // Compact Sleeper-style stat-line builder. Order mirrors the matchup-page
    // row anatomy documented in live-stats Finding 1 (RB form: CAR, YD, REC, YD, TD).
    // QB branch: CMP/ATT, pass YD, pass TD, then rushing.
    function formatStatLine(stats, position) {
      if (!stats) return '--';
      const parts = [];
      if (position === 'QB') {
        if (stats.pass_att) parts.push(`${stats.pass_cmp || 0}/${stats.pass_att} CMP`);
        if (stats.pass_yd) parts.push(`${stats.pass_yd} YD`);
        if (stats.pass_td) parts.push(`${stats.pass_td} TD`);
        if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
        if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
        if (stats.rush_td) parts.push(`${stats.rush_td} TD`);
        return parts.length ? parts.join(', ') : '--';
      }
      if (stats.rush_att) parts.push(`${stats.rush_att} CAR`);
      if (stats.rush_yd) parts.push(`${stats.rush_yd} YD`);
      if (stats.rec_tgt || stats.rec) parts.push(`${stats.rec || 0}/${stats.rec_tgt || 0} REC`);
      if (stats.rec_yd) parts.push(`${stats.rec_yd} YD`);
      const tds = (stats.rush_td || 0) + (stats.rec_td || 0);
      if (tds) parts.push(`${tds} TD`);
      return parts.length ? parts.join(', ') : '0 CAR';
    }

    // Compact delta line for the 10s ticker -- same key set, but only nonzero
    // per-play deltas (a play usually touches 1-3 keys, e.g. a run: rush_att+rush_yd).
    function formatDeltaLine(deltaStats, position) {
      const parts = [];
      if (position === 'QB') {
        if (deltaStats.pass_cmp) parts.push(`+${deltaStats.pass_cmp} CMP`);
        if (deltaStats.pass_yd) parts.push(`${deltaStats.pass_yd >= 0 ? '+' : ''}${deltaStats.pass_yd} YD`);
        if (deltaStats.pass_td) parts.push(`+${deltaStats.pass_td} TD`);
        if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
        if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
        if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
        return parts.length ? parts.join(', ') : null;
      }
      if (deltaStats.rush_att) parts.push(`+${deltaStats.rush_att} CAR`);
      if (deltaStats.rush_yd) parts.push(`${deltaStats.rush_yd >= 0 ? '+' : ''}${deltaStats.rush_yd} YD`);
      if (deltaStats.rec) parts.push(`+${deltaStats.rec} REC`);
      // +TGT ticker line (2026-09-23 port from debug-cards.html): gated on !rec so a completed
      // catch doesn't double-print "+1 REC" and "+1 TGT" for the same play -- a target that
      // wasn't caught is the only case needing its own line.
      if (deltaStats.rec_tgt && !deltaStats.rec) parts.push(`+${deltaStats.rec_tgt} TGT`);
      if (deltaStats.rec_yd) parts.push(`${deltaStats.rec_yd >= 0 ? '+' : ''}${deltaStats.rec_yd} YD`);
      if (deltaStats.rush_td) parts.push(`+${deltaStats.rush_td} TD`);
      if (deltaStats.rec_td) parts.push(`+${deltaStats.rec_td} TD`);
      return parts.length ? parts.join(', ') : null;
    }

    // Per-player ticker state lives in pcCards[playerId], NOT module-level vars.
    function showTicker(card, text) {
      card.tickerEl.textContent = text;
      card.tickerEl.classList.add('visible');
      if (card.tickerHideTimer) clearTimeout(card.tickerHideTimer);
      card.tickerHideTimer = setTimeout(() => {
        card.tickerEl.classList.remove('visible');
      }, PC_TICKER_DISPLAY_MS);
    }

    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    // ---- Backward-state derivation (2026-09-23 port from public/index.html, itself a port of
    //      debug-cards.html's specialLabelForPlay/terminalPhaseLabelForPlay + computeEndSituations'
    //      newest-play classification, Q1 "most current" approach) ----
    // Live only ever has plays up to now, so there is no forward search for the NEWEST play; this
    // classifies it directly. Kept byte-for-byte in lockstep with index.html's copy.
    function specialLabelForPlay(m) {
      if (m.play_type === 'kickoff' || m.play_type === 'kickoff_touchback' || m.play_type === 'kickoff_muffed') {
        return (m.team || m.possession) + ' Kickoff';
      }
      if (m.play_type === 'extra_point' || m.play_type === 'two_point_conversion' || m.play_type === 'two_point_attempt') {
        return (m.team || m.possession) + ' Extra Point';
      }
      if (m.play_type === 'field_goal' && /is GOOD/i.test(m.description || '')) {
        return (m.team || m.possession) + ' Kickoff';
      }
      return null;
    }
    function terminalPhaseLabelForPlay(m) {
      if (m.play_type === 'game_over') return 'Final';
      if (m.play_type === 'period_end' && m.quarter_name === '2') return 'Halftime';
      return null;
    }

    // deriveCurrentState(plays): plays is the newest-first array from the genius endpoint. Returns
    // { clockStr, awayPts, homePts, possession, specialLabel, endZone, down, distance, fieldTeam,
    // fieldYards, gamestate: 'LIVE'|'HALFTIME'|'FINAL' }. Terminal phases first, then the
    // specialLabel check BEFORE is_scoring_play/endZone (extra_point/made-FG also carry
    // is_scoring_play:true and would otherwise be mis-tagged endZone -- same ordering debug uses),
    // else the existing 2026-09-21c down/distance LOOKAHEAD (nearest down-bearing play NEWER than
    // statePlay, since a record's down/distance is pre-snap while its clock reads post-play).
    function deriveCurrentState(plays) {
      const newest = plays[0];
      const nm = newest.metadata || {};

      const term = terminalPhaseLabelForPlay(nm);
      if (term === 'Final') {
        return { clockStr: '', gamestate: 'FINAL', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
      }
      if (term === 'Halftime') {
        return { clockStr: 'Halftime', gamestate: 'HALFTIME', awayPts: nm.away_points, homePts: nm.home_points, possession: null, specialLabel: null, endZone: false };
      }

      let statePlay = plays.find(p => p.metadata && p.metadata.down) || newest;
      const m = statePlay.metadata || {};
      const clockStr = (m.quarter_name != null && m.time_remaining_minutes != null)
        ? `Q${m.quarter_name} ${m.time_remaining_minutes}:${String(m.time_remaining_seconds).padStart(2, '0')}`
        : '--';

      const awayPts = nm.away_points;
      const homePts = nm.home_points;

      const label = specialLabelForPlay(nm);
      if (label) {
        return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.possession, specialLabel: label, endZone: false, down: null, distance: null };
      }
      if (nm.is_scoring_play) {
        return { clockStr, gamestate: 'LIVE', awayPts, homePts, possession: nm.possession, specialLabel: null, endZone: true, down: null, distance: null };
      }

      const statePlayIdx = plays.indexOf(statePlay);
      let situationSourceMeta = m;
      for (let i = statePlayIdx - 1; i >= 0; i--) {
        const cand = plays[i].metadata;
        if (cand && cand.down) { situationSourceMeta = cand; break; }
      }
      return {
        clockStr, gamestate: 'LIVE', awayPts, homePts,
        possession: situationSourceMeta.possession || m.possession,
        specialLabel: null, endZone: false,
        down: situationSourceMeta.down, distance: situationSourceMeta.distance,
        fieldTeam: situationSourceMeta.yard_line_territory, fieldYards: situationSourceMeta.yard_line
      };
    }

    // ---- Pregame data source (2026-09-23 port; Q2/Q2a/Q2b confirmed) ----
    // Sleeper's public /scores/nfl/{seasonType}/{season}/{week} (no auth) returns the week's games;
    // each has top-level `date` + `.metadata.{game_key,away_team,home_team,has_started,is_in_progress,
    // is_over}`. Used ONLY for the pregame VS/@ line since plays[] is empty before kickoff. Week comes
    // from PC_WEEK (user-set on the sender page, delivered via CONFIG). Time is FIXED ET regardless of
    // viewer (Q2b). Returns null when week is unset / game not found / fetch fails.
    let pregameInfo = null;
    async function fetchPregameInfo() {
      if (!PC_WEEK) return null;
      try {
        const res = await fetch(
          `https://api.sleeper.app/scores/nfl/${PC_SEASON_TYPE}/${PC_SEASON}/${PC_WEEK}`,
          { cache: 'no-store' }
        );
        const games = await res.json();
        const game = (games || []).find(g => g.metadata && g.metadata.game_key &&
          g.metadata.away_team === PC_AWAY_TEAM && g.metadata.home_team === PC_HOME_TEAM);
        if (!game) return null;
        let dayTime = '';
        if (game.date) {
          const d = new Date(game.date);
          if (!isNaN(d.getTime())) {
            const day = d.toLocaleString('en-US', { weekday: 'short', timeZone: 'America/New_York' });
            const time = d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' });
            dayTime = `${day} ${time} ET`;
          }
        }
        return {
          dayTime,
          hasStarted: !!(game.metadata && game.metadata.has_started),
          isOver: !!(game.metadata && game.metadata.is_over)
        };
      } catch (e) {
        return null; // transient fetch error -- next poll retries
      }
    }

    async function pollPlayerCard() {
      if (document.body.classList.contains('matchup-mode')) return; // S4.1: matchup mode owns the screen
      const myEpoch = pcConfigEpoch; // see pcConfigEpoch: discard this poll if the config changes mid-flight
      try {
        const [playsRes, statsRes] = await Promise.all([
          fetch(
            `https://api.sleeper.app/plays/nfl/${PC_SEASON_TYPE}/${PC_SEASON}/game/${PC_GAME_ID}?limit=25&provider=genius`,
            { cache: 'no-store' }
          ),
          fetch(
            `https://api.sleeper.app/stats/nfl/game/${PC_GAME_ID}?season_type=${PC_SEASON_TYPE}&season=${PC_SEASON}`,
            { cache: 'no-store' }
          )
        ]);
        const playsData = await playsRes.json();
        if (myEpoch !== pcConfigEpoch) return;
        const plays = playsData.plays || [];

        // PREGAME PATH (2026-09-23 port): plays[] is EMPTY before kickoff. Previously this bailed with
        // `return`, painting nothing (cards stayed at '--'). Now the pregame fetch/paint path runs
        // instead. The extra await gets its OWN epoch guard: a config change mid-fetch must not let a
        // stale pregame paint land over the new lineup's cards.
        if (!plays.length) {
          const pg = await fetchPregameInfo();
          if (myEpoch !== pcConfigEpoch) return;
          pregameInfo = pg;
          Object.keys(pcCards).forEach(function(playerId) {
            const card = pcCards[playerId];
            card.clockEl.textContent = '';
            card.possEl.style.display = 'none';
            card.sitEl.style.display = 'none';
            const oppTeam = card.team === PC_HOME_TEAM ? PC_AWAY_TEAM : PC_HOME_TEAM;
            const vsOrAt = card.team === PC_HOME_TEAM ? 'VS' : '@';
            card.scoreEl.textContent = pregameInfo
              ? `${pregameInfo.dayTime} ${vsOrAt} ${oppTeam}`
              : (PC_WEEK ? '--' : 'Set week to see kickoff time');
            card.statsEl.textContent = formatStatLine(null, card.position);
          });
          return;
        }

        // Game state derived by direct classification of the NEWEST play (see deriveCurrentState).
        // Replaces the old statePlay/situationSourceMeta-only logic and the Number(quarter_name)===2
        // halftime check (now the string compare ported verbatim from debug-cards.html).
        const state = deriveCurrentState(plays);
        const clockStr = state.clockStr;
        const specialState = state.gamestate === 'HALFTIME' ? 'HALFTIME' : (state.gamestate === 'FINAL' ? 'FINAL' : null);

        // Cumulative stats: PRIMARY SOURCE = sportradar /stats/nfl/game/<id> row -- a true
        // whole-game cumulative total, unaffected by genius's limit=25 play-window bug
        // (confirmed 2026-09-20, see project Findings).
        let statsData = [];
        try {
          statsData = await statsRes.json();
        } catch (e) { /* leave empty, formatStatLine handles missing gracefully */ }
        if (myEpoch !== pcConfigEpoch) return; // config changed while stats were in flight -- drop it

        // Paint each card from the SAME two responses already in hand: 3 players cost exactly
        // the same 2 requests as 1.
        Object.keys(pcCards).forEach(function(playerId) {
          const card = pcCards[playerId];

          // Clock: blank on FINAL (result line carries it), literal 'Halftime' on HALFTIME, live
          // Q#/clock otherwise -- all already resolved into state.clockStr by deriveCurrentState.
          card.clockEl.textContent = specialState === 'FINAL' ? '' : clockStr;

          // Score line, per-card perspective, OWN team's score first (no team prefix -- the ordering
          // conveys whose is whose). card.team decides which of away/home is "own". Feed mapping is
          // already correct as-is: away_points = PC_AWAY_TEAM's score, home_points = PC_HOME_TEAM's.
          const isHome = card.team === PC_HOME_TEAM;
          const ownScore = isHome ? state.homePts : state.awayPts;
          const oppScore = isHome ? state.awayPts : state.homePts;
          const oppTeamAbbr = isHome ? PC_AWAY_TEAM : PC_HOME_TEAM;
          const vsOrAt = isHome ? 'VS' : '@';
          let scoreStr;
          if (state.gamestate === 'FINAL' && ownScore != null && oppScore != null) {
            const result = ownScore > oppScore ? 'W' : (ownScore < oppScore ? 'L' : 'T');
            scoreStr = `${result} ${ownScore} - ${oppScore} ${vsOrAt} ${oppTeamAbbr}`;
          } else if (ownScore != null && oppScore != null) {
            scoreStr = `${ownScore} - ${oppScore}`;
          } else {
            scoreStr = '--';
          }
          card.scoreEl.textContent = scoreStr;

          // Possession indicator (.pc-poss) REMOVED per port scope (superseded by the on-Defense /
          // down-distance perspective line). Element kept in the DOM (minimal-diff), always hidden.
          card.possEl.style.display = 'none';
          card.possEl.textContent = '';

          // Situation line, per-card perspective, priority: specialLabel > (endZone && own possession
          // -> 'End Zone') > (opponent possession -> '${team} on Defense') > down/distance > '--'.
          // Row HIDDEN (not blanked) in HALFTIME/FINAL, restored as soon as play resumes.
          card.sitEl.style.display = specialState ? 'none' : '';
          let situationStr;
          if (state.specialLabel) {
            situationStr = state.specialLabel;
          } else if (state.endZone && state.possession === card.team) {
            situationStr = 'End Zone';
          } else if (state.possession && state.possession !== card.team) {
            situationStr = `${card.team} on Defense`;
          } else if (state.down && state.distance != null) {
            situationStr = `${ordinal(state.down)} & ${state.distance} @ ${state.fieldTeam || ''} ${state.fieldYards != null ? state.fieldYards : ''}`.trim();
          } else {
            situationStr = '--';
          }
          card.sitEl.textContent = situationStr;

          const playerStatsRow = (statsData || []).find(r => r.player_id === playerId);
          card.statsEl.textContent = formatStatLine(playerStatsRow ? playerStatsRow.stats : null, card.position);

          // Ticker: still genius-sourced -- only ever needs the SINGLE most recent play FOR THIS
          // PLAYER, which is always within the limit=25 window. Settle policy: only fires on a
          // new CONFIRMED play sequence.
          const playerPlays = plays.filter(p =>
            p.play_stats && p.play_stats.some(ps => ps.player && ps.player.player_id === playerId)
          );
          const mostRecentPlayerPlay = playerPlays.find(p => p.metadata && p.metadata.play_state === 'confirmed');

          if (mostRecentPlayerPlay) {
            const ps = mostRecentPlayerPlay.play_stats.find(x => x.player && x.player.player_id === playerId);
            const seq = mostRecentPlayerPlay.sequence;
            if (!card.baselineSeeded) {
              card.lastTickerSequence = seq;
              card.baselineSeeded = true;
            } else if (seq !== card.lastTickerSequence) {
              card.lastTickerSequence = seq;
              const deltaLine = formatDeltaLine(ps.stats || {}, card.position);
              if (deltaLine) showTicker(card, deltaLine);
            }
          }
        });
      } catch (e) {
        // ignore transient fetch errors -- next 3s poll will retry
      }
    }

    pollPlayerCard();
    setInterval(pollPlayerCard, PC_POLL_MS);

    // ---- R1 CONFIG + R3 STATE_SYNC over the custom namespace ----
    // Validate BEFORE applying anything: a partial/garbled CONFIG must never half-update the cards.
    function isNonEmpty(v) {
      return (typeof v === 'string' && v.trim() !== '') || (typeof v === 'number' && isFinite(v));
    }

    function currentConfig() {
      return { gameId: PC_GAME_ID, awayTeam: PC_AWAY_TEAM, homeTeam: PC_HOME_TEAM, week: PC_WEEK, players: PC_PLAYERS };
    }

    // CONFIG shape (matches index.html PC_CONFIG): { gameId, awayTeam, homeTeam, week,
    // players: [{ playerId, playerName, position, team }, ...] }. Every field and every player entry
    // must validate or the WHOLE config is rejected and the current lineup stays untouched.
    // `team` is REQUIRED per player (per-card own-score-first + on-Defense depend on it; a player
    // without one would silently mis-render, so reject instead). `week` is deliberately NOT in the
    // required-field check: null is a LEGAL value (user hasn't set it yet on the sender page) and
    // must not reject the whole config -- it is normalized below to a positive integer or null.
    function applyConfig(cfg) {
      const valid = cfg
        && ['gameId', 'awayTeam', 'homeTeam'].every(k => isNonEmpty(cfg[k]))
        && Array.isArray(cfg.players)
        && cfg.players.length > 0
        && cfg.players.every(p => p && isNonEmpty(p.playerId) && isNonEmpty(p.playerName) && isNonEmpty(p.position) && isNonEmpty(p.team));
      if (!valid) {
        console.warn('CONFIG rejected (missing/empty field or bad players[]), keeping current config', cfg);
        return false;
      }
      const newPlayers = cfg.players.map(p => ({
        playerId: String(p.playerId),
        playerName: String(p.playerName),
        position: String(p.position),
        team: String(p.team)
      }));
      // Duplicate playerIds would collide as pcCards keys and silently drop a card -- reject.
      if (new Set(newPlayers.map(p => p.playerId)).size !== newPlayers.length) {
        console.warn('CONFIG rejected (duplicate playerId in players[]), keeping current config', cfg);
        return false;
      }
      if (window.MatchupMode) window.MatchupMode.stop(); // S4.1: a valid 3-card CONFIG leaves matchup mode
      const sameTarget = String(cfg.gameId) === PC_GAME_ID
        && JSON.stringify(newPlayers) === JSON.stringify(PC_PLAYERS);
      PC_GAME_ID = String(cfg.gameId);
      PC_AWAY_TEAM = String(cfg.awayTeam);
      PC_HOME_TEAM = String(cfg.homeTeam);
      const wk = parseInt(cfg.week, 10);
      PC_WEEK = Number.isFinite(wk) && wk > 0 ? wk : null;
      PC_PLAYERS = newPlayers;
      pcHasConfig = true;
      pcConfigEpoch++; // invalidates any poll already in flight under the old config

      if (!sameTarget) {
        // New game/lineup: rebuild the cards. Fresh cards start with baselineSeeded=false, so the
        // new players' already-existing latest plays do NOT fire false tickers, and the old
        // players' tickers/timers are cleared by buildCards().
        buildCards();
      }
      pollPlayerCard(); // repaint now instead of waiting up to PC_POLL_MS
      return true;
    }

    // Namespaces must be declared BEFORE start() (Google's migration guide: via a message listener
    // and/or CastReceiverOptions.customNamespaces) -- we do both. Exactly ONE listener.
    // FAIL-SOFT: Google's reference says addCustomMessageListener throws if the system is not
    // ready or the namespace is unsupported, and it is NOT verified that calling it before
    // start() is accepted on this receiver. A throw here would abort the script before
    // context.start() and the whole receiver (video + cards) would die -- far worse than R1/R3
    // not working. So the registration is caught; on failure the cards keep their default
    // config and start() still runs.
    const receiverOptions = new cast.framework.CastReceiverOptions();
    receiverOptions.customNamespaces = {};
    receiverOptions.customNamespaces[CAST_NAMESPACE] = cast.framework.system.MessageType.JSON;

    // playbackConfig tuning (2026-09-21): some captured live sources (see project Findings --
    // "diagnose Chromecast receiver buffering loop") expose an unusually thin live window
    // (as few as ~4 segments / ~15s total buffer depth). CAF's stock default resume threshold
    // can require more buffered segments than a stream like that will ever provide, causing a
    // perpetual auto-pause/auto-resume cycle (black screen, seekbar fill-and-reset). Lowering
    // autoResumeNumberOfSegments lets playback resume with fewer segments in hand. Diagnostic
    // only -- does not fix the underlying thin-window source, just makes CAF more tolerant of it.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeNumberOfSegments = 2; // S4.4b (2026-10-02): was 1 (887c622); 2 still fits the thinnest window we cast (4 segs)
    receiverOptions.playbackConfig = playbackConfig;

    // S4.4b stall watchdog (2026-10-02): on-TV stalls were a slow segment fetch (13.8s vs ~0.3s typical)
    // draining a thin near-live buffer, then the player replaying segments. If BUFFERING lasts longer
    // than STALL_MS: 1st recovery = seek to the live edge, later ones = reload the current media.
    // At most STALL_MAX_RECOVERIES per STALL_WINDOW_MS, then it stops intervening. Reset on PLAYING
    // or when buffering ends. FAIL-SOFT: wrapped so a failure here can never abort the script before
    // context.start().
    try {
      const STALL_MS = 8000;
      const STALL_MAX_RECOVERIES = 3;
      const STALL_WINDOW_MS = 60000;
      const stallPlayerMgr = context.getPlayerManager();
      let stallTimer = null;
      let stallStage = 0;
      let stallRecoveryTimes = [];

      const stallClear = (resetStage) => {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        if (resetStage) stallStage = 0;
      };
      const stallArm = () => {
        stallClear(false);
        stallTimer = setTimeout(stallRecover, STALL_MS);
      };
      const stallRecover = () => {
        stallTimer = null;
        const now = Date.now();
        stallRecoveryTimes = stallRecoveryTimes.filter((t) => now - t < STALL_WINDOW_MS);
        if (stallRecoveryTimes.length >= STALL_MAX_RECOVERIES) {
          console.warn('stall watchdog: recovery cap reached, not intervening further for now');
          return;
        }
        stallRecoveryTimes.push(now);
        try {
          if (stallStage === 0) {
            const range = stallPlayerMgr.getLiveSeekableRange();
            if (range && Number.isFinite(range.end)) {
              const start = Number.isFinite(range.start) ? range.start : 0;
              stallPlayerMgr.seek(Math.max(start, range.end - 2));
              console.warn('stall watchdog: seek to live edge');
            }
          } else {
            const mediaInfo = stallPlayerMgr.getMediaInformation();
            if (mediaInfo) {
              const req = new cast.framework.messages.LoadRequestData();
              req.media = mediaInfo;
              req.autoplay = true;
              Promise.resolve(stallPlayerMgr.load(req)).catch((e) => console.error('stall watchdog: reload failed', e));
              console.warn('stall watchdog: reload media');
            }
          }
        } catch (err) {
          console.error('stall watchdog: recovery step failed', err);
        }
        stallStage++;
        stallArm(); // still buffering after this step -> escalate after another STALL_MS
      };

      stallPlayerMgr.addEventListener(cast.framework.events.EventType.BUFFERING, (e) => {
        if (e && e.isBuffering) { if (!stallTimer) stallArm(); }
        else stallClear(true);
      });
      stallPlayerMgr.addEventListener(cast.framework.events.EventType.PLAYING, () => stallClear(true));
    } catch (err) {
      console.error('stall watchdog setup failed; playback unaffected', err);
    }

    try {
      context.addCustomMessageListener(CAST_NAMESPACE, (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'CONFIG') {
          if (msg.mode === 'matchup' && window.MatchupMode) {
            pcConfigEpoch++; // S4.1: discard any in-flight single-game poll
            window.MatchupMode.applyConfig(msg);
          } else {
            applyConfig(msg);
          }
        } else if (msg.type === 'STATE_REQUEST') {
          // Reply to THIS sender only: sendCustomMessage is documented as per-sender, no broadcast.
          context.sendCustomMessage(CAST_NAMESPACE, event.senderId, {
            type: 'STATE_SYNC',
            hasConfig: pcHasConfig || !!(window.MatchupMode && window.MatchupMode.info().active),
            mode: (window.MatchupMode && window.MatchupMode.info().active) ? 'matchup' : 'players',
            matchup: window.MatchupMode ? window.MatchupMode.info() : null,
            config: currentConfig()
          });
        }
      });
    } catch (err) {
      console.error('custom-namespace listener registration failed; CONFIG/STATE_SYNC disabled, defaults in effect', err);
    }

    context.start(receiverOptions);
  </script>
</body>
</html>
